name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"
  APPLE_TEAM_ID: "G54KQ62958"
  BUNDLE_ID: "com.ppdeli.market"
  PROFILE_NAME: "ppdeli2"

jobs:
  build-ios:
    name: Build Flutter iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version

      - name: Check Signing Files
        run: |
          set -e

          test -f ios/signing/ios_distribution.p12
          test -f ios/signing/ppdeli2.mobileprovision

          echo "Signing files found:"
          ls -lh ios/signing/

      - name: Flutter Clean
        run: |
          flutter clean

          rm -rf build
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

      - name: Flutter Pub Get
        run: |
          flutter pub get

          test -f ios/Flutter/Generated.xcconfig

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi

          pod --version

      - name: Install Pods
        working-directory: ios
        run: |
          pod deintegrate || true
          rm -rf Pods
          rm -rf .symlinks

          pod install --repo-update

      - name: Create SourcePackages Directory
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/ios/Release-iphoneos
          mkdir -p build/ios/archive

          echo "SourcePackages directory:"
          ls -ld build/ios/SourcePackages

      - name: Create Temporary Keychain
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "Importing P12 certificate..."

          security import \
            ios/signing/ios_distribution.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Installed identities:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          security cms \
            -D \
            -i ios/signing/ppdeli2.mobileprovision \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PROFILE_PLIST")

          PROFILE_NAME_FROM_FILE=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PROFILE_PLIST")

          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$PROFILE_PLIST")

          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$PROFILE_PLIST")

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME_FROM_FILE"
          echo "Profile Team ID: $PROFILE_TEAM_ID"
          echo "Profile App ID: $PROFILE_APP_ID"

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "ERROR: Team ID mismatch"
            exit 1
          fi

          EXPECTED_APP_ID="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERROR: Bundle ID mismatch"
            echo "Expected: $EXPECTED_APP_ID"
            echo "Found:    $PROFILE_APP_ID"
            exit 1
          fi

          cp \
            ios/signing/ppdeli2.mobileprovision \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "Provisioning profile installed."

      - name: Configure Xcode Signing
        run: |
          set -e

          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          cp "$PROJECT" "$RUNNER_TEMP/project.pbxproj.backup"

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          text = text.replace(
              "DEVELOPMENT_TEAM = ",
              "DEVELOPMENT_TEAM = G54KQ62958; /* "
          )

          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;"
          )

          path.write_text(text)
          PY

          echo "Xcode project signing configuration prepared."

      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>G54KQ62958</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.ppdeli.market</key>
                  <string>ppdeli2</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          PLIST

          plutil -lint ios/ExportOptions.plist

      - name: Verify Signing Configuration
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "Checking signing identities..."

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Checking provisioning profiles..."

          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo ""
          echo "Checking ExportOptions.plist..."

          plutil -p ios/ExportOptions.plist

      - name: Prepare Flutter Build
        run: |
          set -e

          flutter pub get

          mkdir -p build/ios/SourcePackages

          test -f ios/Flutter/Generated.xcconfig

          echo "Flutter build environment ready."

      - name: Build IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          mkdir -p build/ios/SourcePackages

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            -v

      - name: Find IPA
        run: |
          echo "Searching for IPA files..."

          find build \
            -type f \
            -name "*.ipa" \
            -print

          echo ""
          echo "Searching for archives..."

          find build \
            -type d \
            -name "*.xcarchive" \
            -print

      - name: Verify IPA
        run: |
          set -e

          IPA=$(find build -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA file was not generated."
            exit 1
          fi

          echo "IPA found:"
          echo "$IPA"

          ls -lh "$IPA"

          echo ""
          echo "IPA contents:"
          unzip -l "$IPA" | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-release-ipa
          path: build/**/*.ipa
          if-no-files-found: error

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-dsym
          path: |
            build/ios/archive/**/*.xcarchive/dSYMs/**
            build/ios/Runner.xcarchive/dSYMs/**
          if-no-files-found: warn

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Build Summary
        if: success()
        run: |
          echo "======================================"
          echo "PPDELI iOS BUILD SUCCESS"
          echo "======================================"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Team ID:   $APPLE_TEAM_ID"
          echo "Profile:   $PROFILE_NAME"
          echo "======================================"
