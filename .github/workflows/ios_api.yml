name: Build iOS IPA

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Flutter iOS Release
    runs-on: macos-14
    timeout-minutes: 60

    env:
      FLUTTER_VERSION: "3.44.8"
      APPLE_TEAM_ID: "G54KQ62958"
      BUNDLE_ID: "com.ppdeli.market"
      PROFILE_NAME: "ppdeli2"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Flutter
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      # ============================================================
      # 3. Check Environment
      # ============================================================

      - name: Check Environment
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "macOS:"
          sw_vers

      # ============================================================
      # 4. Check Flutter Project
      # ============================================================

      - name: Check Flutter Project
        run: |
          set -e

          echo "=========================================="
          echo "CHECK FLUTTER PROJECT"
          echo "=========================================="

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          if [ ! -d "ios" ]; then
            echo "ERROR: ios directory not found."
            exit 1
          fi

          if [ ! -f "ios/Runner.xcworkspace/contents.xcworkspacedata" ]; then
            echo "ERROR: Runner.xcworkspace not found."
            exit 1
          fi

          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: Runner.xcodeproj not found."
            exit 1
          fi

          echo ""
          echo "Flutter project detected successfully."

      # ============================================================
      # 5. Check Signing Files
      # ============================================================

      - name: Check Apple Signing Files
        run: |
          set -e

          echo "=========================================="
          echo "CHECK APPLE SIGNING FILES"
          echo "=========================================="

          P12_FILE="ios/signing/ios_distribution.p12"
          PROFILE_FILE="ios/signing/ppdeli2.mobileprovision"

          if [ ! -f "$P12_FILE" ]; then
            echo ""
            echo "ERROR: P12 file not found:"
            echo "$P12_FILE"
            exit 1
          fi

          if [ ! -f "$PROFILE_FILE" ]; then
            echo ""
            echo "ERROR: Provisioning profile not found:"
            echo "$PROFILE_FILE"
            exit 1
          fi

          echo ""
          echo "P12:"
          ls -lh "$P12_FILE"

          echo ""
          echo "Provisioning Profile:"
          ls -lh "$PROFILE_FILE"

          echo ""
          echo "Signing files found successfully."

      # ============================================================
      # 6. Flutter Clean
      # ============================================================

      - name: Flutter Clean
        run: |
          set -e

          echo "=========================================="
          echo "FLUTTER CLEAN"
          echo "=========================================="

          flutter clean

          echo ""
          echo "Removing old iOS build files..."

          rm -rf build
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          echo ""
          echo "Flutter clean completed."

      # ============================================================
      # 7. Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: |
          set -e

          echo "=========================================="
          echo "FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

          echo ""
          echo "Checking Generated.xcconfig..."

          if [ ! -f "ios/Flutter/Generated.xcconfig" ]; then
            echo "Generated.xcconfig not found."
            echo "Running flutter pub get again..."

            flutter pub get
          fi

          if [ ! -f "ios/Flutter/Generated.xcconfig" ]; then
            echo ""
            echo "ERROR: Generated.xcconfig was not created."
            exit 1
          fi

          echo ""
          echo "Generated.xcconfig exists."

      # ============================================================
      # 8. Install CocoaPods
      # ============================================================

      - name: Install CocoaPods
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL COCOAPODS"
          echo "=========================================="

          sudo gem install cocoapods

          echo ""
          echo "CocoaPods version:"
          pod --version

      # ============================================================
      # 9. Install Pods
      # ============================================================

      - name: Install iOS Pods
        working-directory: ios
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL IOS PODS"
          echo "=========================================="

          pod deintegrate || true

          rm -rf Pods
          rm -rf .symlinks

          pod install --repo-update

          echo ""
          echo "Pods installed successfully."

      # ============================================================
      # 10. Prepare SourcePackages
      # ============================================================

      - name: Prepare SourcePackages
        run: |
          set -e

          echo "=========================================="
          echo "PREPARE SOURCEPACKAGES"
          echo "=========================================="

          mkdir -p build
          mkdir -p build/ios
          mkdir -p build/ios/SourcePackages

          test -d build/ios/SourcePackages

          echo ""
          echo "SourcePackages directory ready."

      # ============================================================
      # 11. Create Temporary Keychain
      # ============================================================

      - name: Create Temporary Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "CREATE TEMPORARY KEYCHAIN"
          echo "=========================================="

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo ""
          echo "Temporary keychain created."

      # ============================================================
      # 12. Import P12
      # ============================================================

      - name: Import Apple Distribution Certificate
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "IMPORT APPLE DISTRIBUTION CERTIFICATE"
          echo "=========================================="

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import \
            "ios/signing/ios_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo ""
          echo "Certificate imported."

          echo ""
          echo "Available signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # ============================================================
      # 13. Configure Keychain
      # ============================================================

      - name: Configure Keychain Access
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURE KEYCHAIN"
          echo "=========================================="

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Keychain configured."

      # ============================================================
      # 14. Read Provisioning Profile
      # ============================================================

      - name: Read Provisioning Profile
        run: |
          set -e

          echo "=========================================="
          echo "READ PROVISIONING PROFILE"
          echo "=========================================="

          PROFILE_FILE="ios/signing/ppdeli2.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE_FILE" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME_FROM_FILE=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo ""
          echo "Profile Name:"
          echo "$PROFILE_NAME_FROM_FILE"

          echo ""
          echo "Profile UUID:"
          echo "$PROFILE_UUID"

          echo ""
          echo "Team ID:"
          echo "$PROFILE_TEAM_ID"

          echo ""
          echo "Application ID:"
          echo "$PROFILE_APP_ID"

          EXPECTED_APP_ID="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo ""
            echo "ERROR: Team ID mismatch."
            echo "Expected: $APPLE_TEAM_ID"
            echo "Found: $PROFILE_TEAM_ID"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo ""
            echo "ERROR: Bundle ID mismatch."
            echo "Expected: $EXPECTED_APP_ID"
            echo "Found: $PROFILE_APP_ID"
            exit 1
          fi

          echo ""
          echo "Provisioning profile validation successful."

      # ============================================================
      # 15. Install Provisioning Profile
      # ============================================================

      - name: Install Provisioning Profile
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL PROVISIONING PROFILE"
          echo "=========================================="

          PROVISIONING_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROVISIONING_DIR"

          cp \
            "ios/signing/ppdeli2.mobileprovision" \
            "$PROVISIONING_DIR/$PROFILE_UUID.mobileprovision"

          echo ""
          echo "Provisioning profile installed."

          ls -lh \
            "$PROVISIONING_DIR/$PROFILE_UUID.mobileprovision"

      # ============================================================
      # 16. Configure Xcode Signing
      # ============================================================

      - name: Configure Xcode Signing
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURE XCODE SIGNING"
          echo "=========================================="

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          test -f "$PROJECT_FILE"

          # Team ID
          sed -i '' \
            "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" \
            "$PROJECT_FILE"

          # Bundle ID
          sed -i '' \
            "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" \
            "$PROJECT_FILE"

          # Manual signing
          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT_FILE"

          # Apple Distribution
          sed -i '' \
            's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          echo ""
          echo "Xcode signing configured."

      # ============================================================
      # 17. Configure Provisioning Profile
      # ============================================================

      - name: Configure Xcode Provisioning Profile
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURE PROVISIONING PROFILE"
          echo "=========================================="

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' \
            '/PROVISIONING_PROFILE_SPECIFIER = /d' \
            "$PROJECT_FILE" || true

          sed -i '' \
            '/PROVISIONING_PROFILE = /d' \
            "$PROJECT_FILE" || true

          python3 - <<PY
from pathlib import Path

path = Path("$PROJECT_FILE")
text = path.read_text()

old = 'CODE_SIGN_IDENTITY = "Apple Distribution";'

new = (
    'CODE_SIGN_IDENTITY = "Apple Distribution";\n'
    '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$PROFILE_NAME";'
)

if old not in text:
    raise SystemExit(
        "ERROR: Apple Distribution identity was not found."
    )

text = text.replace(old, new)

path.write_text(text)
PY

          echo ""
          echo "Provisioning profile configured."

          echo ""
          echo "Current signing configuration:"

          grep -E \
            "DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            "$PROJECT_FILE" \
            || true

      # ============================================================
      # 18. Create ExportOptions.plist
      # ============================================================

      - name: Create ExportOptions.plist
        run: |
          set -e

          echo "=========================================="
          echo "CREATE EXPORTOPTIONS.PLIST"
          echo "=========================================="

          cat > ios/ExportOptions.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
"http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>

    <key>method</key>
    <string>app-store</string>

    <key>signingStyle</key>
    <string>manual</string>

    <key>teamID</key>
    <string>${APPLE_TEAM_ID}</string>

    <key>provisioningProfiles</key>
    <dict>
        <key>${BUNDLE_ID}</key>
        <string>${PROFILE_NAME}</string>
    </dict>

    <key>stripSwiftSymbols</key>
    <true/>

    <key>uploadSymbols</key>
    <true/>

</dict>
</plist>
EOF

          echo ""
          echo "ExportOptions.plist created."

          cat ios/ExportOptions.plist

      # ============================================================
      # 19. Final Flutter Pub Get
      # ============================================================

      - name: Final Flutter Pub Get
        run: |
          set -e

          echo "=========================================="
          echo "FINAL FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

          test -f ios/Flutter/Generated.xcconfig

          echo ""
          echo "Final flutter pub get completed."

      # ============================================================
      # 20. Final SourcePackages
      # ============================================================

      - name: Final SourcePackages Preparation
        run: |
          set -e

          mkdir -p build/ios/SourcePackages

          test -d build/ios/SourcePackages

          echo "SourcePackages ready."

      # ============================================================
      # 21. Verify Signing
      # ============================================================

      - name: Verify Apple Signing
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY APPLE SIGNING"
          echo "=========================================="

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Provisioning profiles:"

          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo ""
          echo "Signing verification completed."

      # ============================================================
      # 22. Flutter Build IPA
      # ============================================================

      - name: Build Flutter IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "BUILD FLUTTER IPA"
          echo "=========================================="

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          mkdir -p build/ios/SourcePackages

          echo ""
          echo "Starting Flutter IPA build..."

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            -v

          echo ""
          echo "Flutter IPA build completed."

      # ============================================================
      # 23. Diagnose Output
      # ============================================================

      - name: Diagnose iOS Build Output
        if: always()
        run: |
          echo "=========================================="
          echo "IOS BUILD OUTPUT"
          echo "=========================================="

          echo ""
          echo "IPA files:"

          find . \
            -type f \
            -name "*.ipa" \
            -print \
            2>/dev/null || true

          echo ""
          echo "XCARCHIVE files:"

          find . \
            -type d \
            -name "*.xcarchive" \
            -print \
            2>/dev/null || true

          echo ""
          echo "build/ios contents:"

          if [ -d "build/ios" ]; then
            find build/ios \
              -maxdepth 6 \
              -print \
              2>/dev/null \
              | sort || true
          else
            echo "build/ios does not exist."
          fi

      # ============================================================
      # 24. Verify IPA
      # ============================================================

      - name: Verify IPA
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY GENERATED IPA"
          echo "=========================================="

          IPA_FILE=$(
            find build/ios \
              -type f \
              -name "*.ipa" \
              -print \
              -quit \
              2>/dev/null || true
          )

          if [ -z "$IPA_FILE" ]; then
            echo ""
            echo "ERROR: No IPA file was generated."
            echo ""
            echo "The Flutter/Xcode build did not generate an IPA."
            echo ""
            echo "Check the Build Flutter IPA step above."
            exit 1
          fi

          echo ""
          echo "IPA FOUND:"
          echo "$IPA_FILE"

          echo ""
          echo "IPA SIZE:"
          ls -lh "$IPA_FILE"

          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 25. Upload IPA
      # ============================================================

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-release-ipa
          path: ${{ env.IPA_FILE }}
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 26. Upload dSYM
      # ============================================================

      - name: Upload dSYM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-release-dsym
          path: build/ios/archive/Runner.xcarchive/dSYMs/**
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 27. Success
      # ============================================================

      - name: Build Success
        if: success()
        run: |
          echo "=========================================="
          echo "PPDELI IOS BUILD SUCCESS"
          echo "=========================================="

          echo ""
          echo "App Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Apple Team:"
          echo "$APPLE_TEAM_ID"

          echo ""
          echo "Provisioning Profile:"
          echo "$PROFILE_NAME"

          echo ""
          echo "IPA:"
          echo "$IPA_FILE"

          echo ""
          echo "IPA uploaded to GitHub Actions Artifacts."

      # ============================================================
      # 28. Cleanup
      # ============================================================

      - name: Cleanup Signing Environment
        if: always()
        run: |
          echo "=========================================="
          echo "CLEANUP"
          echo "=========================================="

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain \
              "$KEYCHAIN_PATH" \
              || true
          fi

          rm -f \
            "$RUNNER_TEMP/profile.plist" \
            || true

          echo ""
          echo "Cleanup completed."
