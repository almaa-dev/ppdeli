name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"
  APPLE_TEAM_ID: "G54KQ62958"
  BUNDLE_ID: "com.ppdeli.market"
  PROFILE_NAME: "PPDELI App Store Distribution"

jobs:
  build-ios:
    name: Build PPDELI iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ==========================================
      # 3. Flutter dependencies
      # ==========================================
      - name: Flutter Setup
        run: |
          set -e

          flutter --version

          flutter config --no-enable-swift-package-manager || true

          flutter clean
          flutter pub get

      # ==========================================
      # 4. CocoaPods
      # ==========================================
      - name: Install CocoaPods
        run: |
          set -e

          cd ios

          pod install --repo-update

          cd ..

      # ==========================================
      # 5. Decode Apple signing files
      # ==========================================
      - name: Decode Apple Signing Files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          SIGNING_DIR="$RUNNER_TEMP/ppdeli-signing"

          mkdir -p "$SIGNING_DIR"

          echo "Decoding Apple Distribution certificate..."

          echo "$IOS_CERTIFICATE_BASE64" | base64 -D \
            > "$SIGNING_DIR/ios_distribution.p12"

          echo "Decoding provisioning profile..."

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D \
            > "$SIGNING_DIR/profile.mobileprovision"

          chmod 600 "$SIGNING_DIR/ios_distribution.p12"
          chmod 600 "$SIGNING_DIR/profile.mobileprovision"

          echo "Signing files:"
          ls -lh "$SIGNING_DIR"

      # ==========================================
      # 6. Verify P12 BEFORE Keychain import
      # ==========================================
      - name: Verify P12
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          P12_FILE="$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12"

          echo "=========================================="
          echo "VERIFYING P12"
          echo "=========================================="

          if [ ! -f "$P12_FILE" ]; then
            echo "❌ P12 file not found"
            exit 1
          fi

          echo "P12 size:"
          ls -lh "$P12_FILE"

          echo "P12 file type:"
          file "$P12_FILE"

          echo "Testing P12 password with OpenSSL..."

          openssl pkcs12 \
            -in "$P12_FILE" \
            -noout \
            -passin env:IOS_CERTIFICATE_PASSWORD

          echo "=========================================="
          echo "✅ P12 PASSWORD IS VALID"
          echo "=========================================="

      # ==========================================
      # 7. Verify provisioning profile
      # ==========================================
      - name: Verify Provisioning Profile
        run: |
          set -e

          PROFILE="$RUNNER_TEMP/ppdeli-signing/profile.mobileprovision"
          PLIST="$RUNNER_TEMP/ppdeli-signing/profile.plist"

          echo "=========================================="
          echo "VERIFYING PROVISIONING PROFILE"
          echo "=========================================="

          security cms \
            -D \
            -i "$PROFILE" \
            > "$PLIST"

          PROFILE_NAME=$( \
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PLIST" \
          )

          TEAM_ID=$( \
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$PLIST" \
          )

          APP_ID=$( \
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$PLIST" \
          )

          PROFILE_UUID=$( \
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PLIST" \
          )

          echo "Profile Name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "App ID: $APP_ID"
          echo "UUID: $PROFILE_UUID"

          if [ "$PROFILE_NAME" != "${PROFILE_NAME}" ]; then
            echo "❌ Invalid provisioning profile name"
            exit 1
          fi

          if [ "$TEAM_ID" != "${APPLE_TEAM_ID}" ]; then
            echo "❌ Wrong Team ID"
            exit 1
          fi

          if [ "$APP_ID" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]; then
            echo "❌ Wrong Bundle ID / App ID"
            exit 1
          fi

          echo "=========================================="
          echo "✅ PROVISIONING PROFILE IS VALID"
          echo "=========================================="

      # ==========================================
      # 8. Create temporary Keychain
      # ==========================================
      - name: Create Keychain and Import Certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/ppdeli-signing.keychain-db"
          P12_FILE="$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "CREATING TEMPORARY KEYCHAIN"
          echo "=========================================="

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "IMPORTING APPLE DISTRIBUTION CERTIFICATE"
          echo "=========================================="

          security import \
            "$P12_FILE" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          echo "Setting key partition list..."

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "SIGNING IDENTITIES"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # ==========================================
      # 9. Install provisioning profile
      # ==========================================
      - name: Install Provisioning Profile
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          PROFILE="$RUNNER_TEMP/ppdeli-signing/profile.mobileprovision"
          PLIST="$RUNNER_TEMP/ppdeli-signing/profile.plist"

          PROFILE_UUID=$( \
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PLIST" \
          )

          cp "$PROFILE" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "Installed provisioning profile:"
          echo "$PROFILE_UUID.mobileprovision"

      # ==========================================
      # 10. Create ExportOptions.plist
      # ==========================================
      - name: Create ExportOptions
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          plutil -lint ios/ExportOptions.plist

          echo "ExportOptions.plist created successfully."

      # ==========================================
      # 11. Build unsigned archive
      # ==========================================
      - name: Build iOS Archive
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING UNSIGNED IOS ARCHIVE"
          echo "=========================================="

          flutter build ipa \
            --release \
            --no-codesign

          echo "=========================================="
          echo "ARCHIVES"
          echo "=========================================="

          find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print

      # ==========================================
      # 12. Sign and export IPA
      # ==========================================
      - name: Sign and Export IPA
        run: |
          set -e

          ARCHIVE=$( \
            find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print -quit \
          )

          if [ -z "$ARCHIVE" ]; then
            echo "❌ XCArchive not found."
            exit 1
          fi

          echo "Archive:"
          echo "$ARCHIVE"

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa

          echo "=========================================="
          echo "SIGNING AND EXPORTING IPA"
          echo "=========================================="

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

      # ==========================================
      # 13. Verify IPA
      # ==========================================
      - name: Verify IPA
        run: |
          set -e

          IPA=$( \
            find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            -print -quit \
          )

          if [ -z "$IPA" ]; then
            echo "❌ IPA was not created."
            exit 1
          fi

          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh "$IPA"

          CHECK_DIR="$RUNNER_TEMP/ipa-check"

          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          unzip -q "$IPA" \
            -d "$CHECK_DIR"

          APP="$CHECK_DIR/Payload/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "❌ Runner.app not found."
            exit 1
          fi

          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo "Code signing information:"

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1 | grep -E \
            "Identifier=|Authority=|TeamIdentifier=" || true

          echo "=========================================="
          echo "✅ IPA VERIFIED SUCCESSFULLY"
          echo "=========================================="

      # ==========================================
      # 14. Upload IPA
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 15. Cleanup
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          set +e

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain \
              "$KEYCHAIN_PATH" || true
          fi

          rm -rf \
            "$RUNNER_TEMP/ppdeli-signing"

          echo "Cleanup completed."
