name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"
  TEAM_ID: "G54KQ62958"
  BUNDLE_ID: "com.ppdeli.market"
  PROFILE_NAME: "PPDELI App Store Distribution"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 3. Prepare Flutter
      - name: Flutter Pub Get
        run: |
          set -e
          flutter config --no-enable-swift-package-manager || true
          flutter pub get
          test -f ios/Flutter/Generated.xcconfig

      # 4. CocoaPods
      - name: Install Pods
        working-directory: ios
        run: |
          set -e
          pod deintegrate || true
          rm -rf Pods .symlinks
          pod install --repo-update
          test -d Pods

      # 5. Decode signing files
      - name: Decode Signing
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/signing"

          printf '%s' "$P12" | base64 --decode \
            > "$RUNNER_TEMP/signing/certificate.p12"

          printf '%s' "$PROFILE" | base64 --decode \
            > "$RUNNER_TEMP/signing/profile.mobileprovision"

          test -s "$RUNNER_TEMP/signing/certificate.p12"
          test -s "$RUNNER_TEMP/signing/profile.mobileprovision"

      # 6. Keychain
      - name: Setup Keychain
        env:
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN="$RUNNER_TEMP/ppdeli.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN"

          security import \
            "$RUNNER_TEMP/signing/certificate.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN"

      # 7. Provisioning Profile
      - name: Install Profile
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          security cms \
            -D \
            -i "$RUNNER_TEMP/signing/profile.mobileprovision" \
            > "$PROFILE_PLIST"

          UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PROFILE_PLIST"
          )

          NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PROFILE_PLIST"
          )

          TEAM=$(
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$PROFILE_PLIST"
          )

          APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$PROFILE_PLIST"
          )

          echo "Profile: $NAME"
          echo "UUID: $UUID"
          echo "Team: $TEAM"
          echo "App ID: $APP_ID"

          test "$NAME" = "$PROFILE_NAME"
          test "$TEAM" = "$TEAM_ID"
          test "$APP_ID" = "$TEAM_ID.$BUNDLE_ID"

          cp \
            "$RUNNER_TEMP/signing/profile.mobileprovision" \
            "$PROFILE_DIR/$UUID.mobileprovision"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      # 8. Force Manual Signing
      - name: Configure Signing
        run: |
          set -e

          cd ios

          xcodebuild \
            -project Runner.xcodeproj \
            -target Runner \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -showBuildSettings >/dev/null

      # 9. Export Options
      - name: Create ExportOptions
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          plutil -lint ios/ExportOptions.plist

      # 10. Build IPA
      - name: Build IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          flutter clean
          flutter pub get

          mkdir -p build/ios/SourcePackages

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            -v

      # 11. Verify IPA
      - name: Verify IPA
        run: |
          set -e

          IPA=$(find build -name "*.ipa" -type f | head -n 1)

          test -n "$IPA"

          echo "IPA:"
          ls -lh "$IPA"

          unzip -t "$IPA" >/dev/null

      # 12. Upload IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-release-ipa
          path: build/**/*.ipa
          if-no-files-found: error
          retention-days: 7

      # 13. Cleanup
      - name: Cleanup
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
