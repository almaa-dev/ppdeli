name: Build Flutter iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Signed iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    env:
      # ⚠️ تأكد أن 3.44.8 موجود فعلاً على قناة stable
      FLUTTER_VERSION: "3.44.8"
      APPLE_TEAM_ID: "G54KQ62958"
      BUNDLE_ID: "com.ppdeli.market"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ─────────────── فحوصات لا توقف البناء ───────────────
      - name: Analyze (تجاوز التحذيرات)
        run: flutter analyze
        continue-on-error: true

      # ─────────────── استرجاع ملفات التوقيع من الأسرار ✅ ───────────────
      - name: Restore signing files from secrets
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ios/signing
          echo "$CERT_B64"    | base64 --decode > ios/signing/ios_distribution.p12
          echo "$PROFILE_B64" | base64 --decode > ios/signing/ppdeli2.mobileprovision
          ls -lh ios/signing/

      - name: Check signing files
        run: |
          test -f ios/signing/ios_distribution.p12
          test -f ios/signing/ppdeli2.mobileprovision
          echo "Signing files OK."

      # ─────────────── تجهيز Flutter ───────────────
      - name: Flutter Clean
        run: |
          flutter clean
          rm -rf build ios/Pods ios/.symlinks ios/Flutter/ephemeral

      - name: Flutter Pub Get
        run: |
          flutter pub get
          # Generated.xcconfig ضروري لـ CocoaPods
          if [ ! -f ios/Flutter/Generated.xcconfig ]; then
            flutter pub get
          fi
          test -f ios/Flutter/Generated.xcconfig

      # ─────────────── CocoaPods ───────────────
      - name: Install CocoaPods (إن لم يكن مثبتاً)
        run: |
          command -v pod >/dev/null 2>&1 || sudo gem install cocoapods
          pod --version

      - name: Install iOS Pods
        working-directory: ios
        run: |
          pod deintegrate || true
          rm -rf Pods .symlinks
          pod install --repo-update

      # ─────────────── Keychain ───────────────
      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import ios/signing/ios_distribution.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ─────────────── Provisioning Profile ───────────────
      # ✅ الإصلاح: استخراج الاسم الحقيقي من الملف واستخدامه لاحقاً
      - name: Read & validate provisioning profile
        run: |
          security cms -D -i ios/signing/ppdeli2.mobileprovision > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Profile Name : $PROFILE_NAME"
          echo "Profile UUID : $PROFILE_UUID"
          echo "Team ID      : $PROFILE_TEAM_ID"
          echo "App ID       : $PROFILE_APP_ID"

          EXPECTED_APP_ID="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          [ "$PROFILE_TEAM_ID" = "$APPLE_TEAM_ID" ] || \
            { echo "❌ Team ID mismatch: expected $APPLE_TEAM_ID, found $PROFILE_TEAM_ID"; exit 1; }

          [ "$PROFILE_APP_ID" = "$EXPECTED_APP_ID" ] || \
            { echo "❌ Bundle ID mismatch: expected $EXPECTED_APP_ID, found $PROFILE_APP_ID"; exit 1; }

          # ❌ Development profile سيفشل في app-store export
          if /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "❌ This is a Development/Ad-Hoc profile (has ProvisionedDevices) — app-store export will fail."
            exit 1
          fi

          echo "✅ Provisioning profile validation successful."

      - name: Install provisioning profile
        run: |
          PROFILE_DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DEST"
          cp ios/signing/ppdeli2.mobileprovision \
             "$PROFILE_DEST/$PROFILE_UUID.mobileprovision"

      # ─────────────── Xcode Signing Configuration ───────────────
      - name: Configure Xcode signing
        run: |
          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"
          test -f "$PROJECT_FILE"

          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" "$PROJECT_FILE"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$PROJECT_FILE"

          # ✅ نسخة بديلة شائعة في القوالب الحديثة
          sed -i '' 's/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = "Apple Development";/CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Distribution";/g' "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = "iPhone Developer";/CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Distribution";/g' "$PROJECT_FILE"

          echo "Xcode signing settings updated."

      - name: Configure provisioning profile in Xcode
        run: |
          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          # حذف أي إعدادات قديمة
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER = /d' "$PROJECT_FILE" || true
          sed -i '' '/PROVISIONING_PROFILE = /d' "$PROJECT_FILE" || true

          python3 - "$PROJECT_FILE" "$PROFILE_NAME" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
profile_name = sys.argv[2]
text = path.read_text()

old = 'CODE_SIGN_IDENTITY = "Apple Distribution";'
new = (old +
       '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + profile_name + '";')

count = text.count(old)
if count == 0:
    raise SystemExit('ERROR: "Apple Distribution" identity not found in pbxproj. '
                     'Check grep output of CODE_SIGN_IDENTITY lines.')

text = text.replace(old, new)
path.write_text(text)
print(f"✅ PROVISIONING_PROFILE_SPECIFIER added to {count} configuration(s).")
PY

          echo ""
          grep -E "DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            "$PROJECT_FILE" || true

      # ─────────────── Export Options ───────────────
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>app-store</string>
    <key>teamID</key>
    <string>${APPLE_TEAM_ID}</string>
    <key>signingStyle</key>
    <string>manual</string>
    <key>provisioningProfiles</key>
    <dict>
        <key>${BUNDLE_ID}</key>
        <string>${PROFILE_NAME}</string>
    </dict>
    <key>stripSwiftSymbols</key>
    <true/>
    <key>uploadSymbols</key>
    <true/>
</dict>
</plist>
EOF

      # ─────────────── البناء ───────────────
      - name: Build Flutter IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # أضف -v في النهاية إذا احتجت سجلات تفصيلية للتشخيص
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # ─────────────── التحقق والرفع ───────────────
      - name: Diagnose build output
        if: always()
        run: |
          echo "IPA files:"
          find . -type f -name "*.ipa" -print 2>/dev/null || true
          echo ""
          echo "XCARCHIVE:"
          find . -type d -name "*.xcarchive" -print 2>/dev/null || true

      - name: Verify IPA
        run: |
          IPA_FILE=$(find build/ios -type f -name "*.ipa" -print -quit 2>/dev/null || true)

          if [ -z "$IPA_FILE" ]; then
            echo "❌ No IPA file was generated."
            exit 1
          fi

          echo "✅ IPA FOUND: $IPA_FILE"
          ls -lh "$IPA_FILE"
          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-release-ipa
          path: ${{ env.IPA_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload dSYM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-release-dsym
          path: build/ios/archive/Runner.xcarchive/dSYMs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Build success
        if: success()
        run: |
          echo "✅ PPDELI IOS BUILD SUCCESS"
          echo "Bundle ID : $BUNDLE_ID"
          echo "Team ID   : $APPLE_TEAM_ID"
          echo "Profile   : $PROFILE_NAME"
          echo "IPA       : $IPA_FILE"

      - name: Cleanup signing environment
        if: always()
        run: |
          [ -z "${KEYCHAIN_PATH:-}" ] || security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/profile.plist" || true
