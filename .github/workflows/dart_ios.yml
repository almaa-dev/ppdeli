name: Build Flutter iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Flutter iOS Release IPA
    runs-on: macos-14
    timeout-minutes: 60

    env:
      FLUTTER_VERSION: "3.44.8"
      APPLE_TEAM_ID: "G54KQ62958"
      BUNDLE_ID: "com.ppdeli.market"
      PROFILE_NAME: "ppdeli2"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. Setup Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 3. Environment information
      # ============================================================
      - name: Check build environment
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Ruby:"
          ruby --version

          echo ""
          echo "CocoaPods:"
          pod --version || true

      # ============================================================
      # 4. Check project
      # ============================================================
      - name: Check Flutter project
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING FLUTTER PROJECT"
          echo "=========================================="

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          if [ ! -d "ios" ]; then
            echo "ERROR: ios directory not found."
            exit 1
          fi

          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: Xcode project not found."
            exit 1
          fi

          echo ""
          echo "Flutter project detected successfully."

      # ============================================================
      # 5. Check signing files
      # ============================================================
      - name: Check Apple signing files
        run: |
          set -e

          echo "=========================================="
          echo "APPLE SIGNING FILES"
          echo "=========================================="

          P12_FILE="ios/signing/ios_distribution.p12"
          PROFILE_FILE="ios/signing/ppdeli2.mobileprovision"

          if [ ! -f "$P12_FILE" ]; then
            echo ""
            echo "ERROR: P12 certificate not found:"
            echo "$P12_FILE"
            exit 1
          fi

          if [ ! -f "$PROFILE_FILE" ]; then
            echo ""
            echo "ERROR: Provisioning profile not found:"
            echo "$PROFILE_FILE"
            exit 1
          fi

          echo ""
          echo "P12 certificate:"
          ls -lh "$P12_FILE"

          echo ""
          echo "Provisioning profile:"
          ls -lh "$PROFILE_FILE"

          echo ""
          echo "Apple signing files are available."

      # ============================================================
      # 6. Flutter Clean
      # ============================================================
      - name: Flutter clean
        run: |
          set -e

          echo "=========================================="
          echo "FLUTTER CLEAN"
          echo "=========================================="

          flutter clean

          echo ""
          echo "Removing old build directories..."

          rm -rf build
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          echo ""
          echo "Flutter clean completed."

      # ============================================================
      # 7. Flutter Pub Get
      # ============================================================
      - name: Flutter pub get
        run: |
          set -e

          echo "=========================================="
          echo "FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

          echo ""
          echo "Flutter dependencies installed successfully."

      # ============================================================
      # 8. Verify Generated.xcconfig
      # ============================================================
      - name: Verify Flutter Generated.xcconfig
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING GENERATED.XCCONFIG"
          echo "=========================================="

          if [ ! -f "ios/Flutter/Generated.xcconfig" ]; then
            echo ""
            echo "Generated.xcconfig was not created by pub get."
            echo "Running flutter pub get again..."

            flutter pub get
          fi

          if [ ! -f "ios/Flutter/Generated.xcconfig" ]; then
            echo ""
            echo "ERROR: Generated.xcconfig still does not exist."
            exit 1
          fi

          echo ""
          echo "Generated.xcconfig exists."

      # ============================================================
      # 9. Install CocoaPods
      # ============================================================
      - name: Install CocoaPods
        run: |
          set -e

          echo "=========================================="
          echo "COCOAPODS"
          echo "=========================================="

          sudo gem install cocoapods

          echo ""
          echo "CocoaPods version:"
          pod --version

      # ============================================================
      # 10. Prepare iOS build directories
      # ============================================================
      - name: Prepare iOS build directories
        run: |
          set -e

          echo "=========================================="
          echo "PREPARING IOS BUILD DIRECTORIES"
          echo "=========================================="

          mkdir -p build
          mkdir -p build/ios
          mkdir -p build/ios/SourcePackages

          echo ""
          echo "Created:"
          echo "build/ios/SourcePackages"

          ls -ld build
          ls -ld build/ios
          ls -ld build/ios/SourcePackages

      # ============================================================
      # 11. CocoaPods install
      # ============================================================
      - name: Install iOS Pods
        working-directory: ios
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING IOS PODS"
          echo "=========================================="

          pod deintegrate || true

          rm -rf Pods
          rm -rf .symlinks

          pod install --repo-update

          echo ""
          echo "Pods installed successfully."

      # ============================================================
      # 12. Recreate SourcePackages
      # ============================================================
      - name: Prepare SourcePackages
        run: |
          set -e

          echo "=========================================="
          echo "PREPARING SOURCEPACKAGES"
          echo "=========================================="

          mkdir -p build
          mkdir -p build/ios
          mkdir -p build/ios/SourcePackages

          test -d build/ios/SourcePackages

          echo ""
          echo "SourcePackages directory ready."

      # ============================================================
      # 13. Create temporary keychain
      # ============================================================
      - name: Create temporary signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "CREATING TEMPORARY KEYCHAIN"
          echo "=========================================="

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo ""
          echo "Temporary keychain created."

      # ============================================================
      # 14. Import Apple Distribution P12
      # ============================================================
      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "IMPORTING APPLE DISTRIBUTION CERTIFICATE"
          echo "=========================================="

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import \
            "ios/signing/ios_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo ""
          echo "Certificate imported successfully."

          echo ""
          echo "Signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # ============================================================
      # 15. Configure keychain
      # ============================================================
      - name: Configure signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURING KEYCHAIN"
          echo "=========================================="

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Keychain configured successfully."

      # ============================================================
      # 16. Read provisioning profile
      # ============================================================
      - name: Read provisioning profile
        run: |
          set -e

          echo "=========================================="
          echo "READING PROVISIONING PROFILE"
          echo "=========================================="

          PROFILE_PATH="ios/signing/ppdeli2.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME_FROM_FILE=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo ""
          echo "------------------------------------------"
          echo "Profile Name: $PROFILE_NAME_FROM_FILE"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID:      $PROFILE_TEAM_ID"
          echo "App ID:       $PROFILE_APP_ID"
          echo "------------------------------------------"

          EXPECTED_APP_ID="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo ""
            echo "ERROR: Provisioning profile Team ID mismatch."
            echo "Expected: $APPLE_TEAM_ID"
            echo "Found:    $PROFILE_TEAM_ID"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo ""
            echo "ERROR: Provisioning profile Bundle ID mismatch."
            echo "Expected: $EXPECTED_APP_ID"
            echo "Found:    $PROFILE_APP_ID"
            exit 1
          fi

          echo ""
          echo "Provisioning profile validation successful."

      # ============================================================
      # 17. Install provisioning profile
      # ============================================================
      - name: Install provisioning profile
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING PROVISIONING PROFILE"
          echo "=========================================="

          PROFILE_DEST="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DEST"

          cp \
            "ios/signing/ppdeli2.mobileprovision" \
            "$PROFILE_DEST/$PROFILE_UUID.mobileprovision"

          echo ""
          echo "Installed profile:"
          ls -lh "$PROFILE_DEST/$PROFILE_UUID.mobileprovision"

      # ============================================================
      # 18. Configure Xcode project signing
      # ============================================================
      - name: Configure Xcode project
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURING XCODE PROJECT"
          echo "=========================================="

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project file not found."
            exit 1
          fi

          # Team ID
          sed -i '' \
            "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" \
            "$PROJECT_FILE"

          # Bundle ID
          sed -i '' \
            "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" \
            "$PROJECT_FILE"

          # Manual signing
          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT_FILE"

          # Distribution certificate
          sed -i '' \
            's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          echo ""
          echo "Xcode signing configuration updated."

      # ============================================================
      # 19. Configure provisioning profile in Xcode
      # ============================================================
      - name: Configure Xcode provisioning profile
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURING XCODE PROVISIONING PROFILE"
          echo "=========================================="

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' \
            '/PROVISIONING_PROFILE_SPECIFIER = /d' \
            "$PROJECT_FILE" || true

          sed -i '' \
            '/PROVISIONING_PROFILE = /d' \
            "$PROJECT_FILE" || true

          python3 <<PY
from pathlib import Path

path = Path("$PROJECT_FILE")
text = path.read_text()

old = 'CODE_SIGN_IDENTITY = "Apple Distribution";'

new = (
    'CODE_SIGN_IDENTITY = "Apple Distribution";\n'
    '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$PROFILE_NAME";'
)

if old in text:
    text = text.replace(old, new)
else:
    raise SystemExit(
        "ERROR: CODE_SIGN_IDENTITY = Apple Distribution was not found."
    )

path.write_text(text)
PY

          echo ""
          echo "Provisioning profile configured."

          echo ""
          echo "Current signing settings:"

          grep -E \
            "DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            "$PROJECT_FILE" \
            || true

      # ============================================================
      # 20. Create ExportOptions.plist
      # ============================================================
      - name: Create ExportOptions.plist
        run: |
          set -e

          echo "=========================================="
          echo "CREATING EXPORTOPTIONS.PLIST"
          echo "=========================================="

          cat > ios/ExportOptions.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
"http://www.apple.com/DTDs/PropertyList-1.0.dtd">

<plist version="1.0">
<dict>

    <key>method</key>
    <string>app-store</string>

    <key>teamID</key>
    <string>${APPLE_TEAM_ID}</string>

    <key>signingStyle</key>
    <string>manual</string>

    <key>provisioningProfiles</key>
    <dict>
        <key>${BUNDLE_ID}</key>
        <string>${PROFILE_NAME}</string>
    </dict>

    <key>stripSwiftSymbols</key>
    <true/>

    <key>uploadSymbols</key>
    <true/>

</dict>
</plist>
EOF

          echo ""
          echo "ExportOptions.plist:"
          cat ios/ExportOptions.plist

      # ============================================================
      # 21. Final Flutter pub get
      # ============================================================
      - name: Final Flutter pub get
        run: |
          set -e

          echo "=========================================="
          echo "FINAL FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

          if [ ! -f "ios/Flutter/Generated.xcconfig" ]; then
            echo ""
            echo "ERROR: Generated.xcconfig missing after pub get."
            exit 1
          fi

          echo ""
          echo "Final Flutter pub get completed."

      # ============================================================
      # 22. Final SourcePackages preparation
      # ============================================================
      - name: Final SourcePackages preparation
        run: |
          set -e

          echo "=========================================="
          echo "FINAL SOURCEPACKAGES PREPARATION"
          echo "=========================================="

          mkdir -p build
          mkdir -p build/ios
          mkdir -p build/ios/SourcePackages

          test -d build/ios/SourcePackages

          echo ""
          echo "SourcePackages ready."

      # ============================================================
      # 23. Verify signing
      # ============================================================
      - name: Verify Apple signing
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING APPLE SIGNING"
          echo "=========================================="

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Provisioning profiles:"

          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo ""
          echo "Checking project signing configuration:"

          grep -E \
            "DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj \
            || true

          echo ""
          echo "Apple signing verification completed."

      # ============================================================
      # 24. Build Flutter IPA
      # ============================================================
      - name: Build Flutter IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING FLUTTER IOS IPA"
          echo "=========================================="

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          mkdir -p build
          mkdir -p build/ios
          mkdir -p build/ios/SourcePackages

          echo ""
          echo "Starting Flutter Release IPA build..."

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            -v

          echo ""
          echo "Flutter IPA build command completed."

      # ============================================================
      # 25. Diagnose build output
      # ============================================================
      - name: Diagnose iOS build output
        if: always()
        run: |
          echo "=========================================="
          echo "IOS BUILD OUTPUT DIAGNOSTICS"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "IPA files:"

          find . \
            -type f \
            -name "*.ipa" \
            -print \
            2>/dev/null \
            || true

          echo ""
          echo "XCARCHIVE directories:"

          find . \
            -type d \
            -name "*.xcarchive" \
            -print \
            2>/dev/null \
            || true

          echo ""
          echo "build/ios:"

          if [ -d "build/ios" ]; then
            find build/ios \
              -maxdepth 6 \
              -print \
              2>/dev/null \
              | sort \
              || true
          else
            echo "build/ios does not exist."
          fi

          echo ""
          echo "build/ios/ipa:"

          if [ -d "build/ios/ipa" ]; then
            ls -lah build/ios/ipa
          else
            echo "build/ios/ipa does not exist."
          fi

          echo ""
          echo "End diagnostics."

      # ============================================================
      # 26. Verify IPA
      # ============================================================
      - name: Verify generated IPA
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING GENERATED IPA"
          echo "=========================================="

          IPA_FILE=$(
            find build/ios \
              -type f \
              -name "*.ipa" \
              -print \
              -quit \
              2>/dev/null \
              || true
          )

          if [ -z "$IPA_FILE" ]; then
            echo ""
            echo "ERROR: No IPA file was generated."
            echo ""
            echo "The Flutter/Xcode build did not generate an IPA."
            echo ""
            echo "Check the 'Build Flutter IPA' step above."
            exit 1
          fi

          echo ""
          echo "IPA found:"
          echo "$IPA_FILE"

          echo ""
          echo "IPA size:"
          ls -lh "$IPA_FILE"

          echo ""
          echo "IPA verification successful."

          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 27. Upload IPA
      # ============================================================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-release-ipa
          path: ${{ env.IPA_FILE }}
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 28. Upload dSYM
      # ============================================================
      - name: Upload dSYM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-release-dsym
          path: |
            build/ios/archive/Runner.xcarchive/dSYMs/**
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 29. Build summary
      # ============================================================
      - name: Build summary
        if: success()
        run: |
          echo "=========================================="
          echo "PPDELI IOS BUILD SUCCESS"
          echo "=========================================="

          echo ""
          echo "App:"
          echo "PPDeli"

          echo ""
          echo "Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Apple Team:"
          echo "$APPLE_TEAM_ID"

          echo ""
          echo "Provisioning Profile:"
          echo "$PROFILE_NAME"

          echo ""
          echo "IPA:"
          echo "$IPA_FILE"

          echo ""
          echo "The IPA is available in GitHub Actions Artifacts."

      # ============================================================
      # 30. Cleanup
      # ============================================================
      - name: Cleanup signing environment
        if: always()
        run: |
          echo "=========================================="
          echo "CLEANUP"
          echo "=========================================="

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain \
              "$KEYCHAIN_PATH" \
              || true
          fi

          rm -f \
            "$RUNNER_TEMP/profile.plist" \
            || true

          echo ""
          echo "Temporary signing environment cleaned."
