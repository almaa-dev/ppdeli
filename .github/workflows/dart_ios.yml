name: Build iOS IPA

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  APPLE_TEAM_ID: "G54KQ62958"
  BUNDLE_ID: "com.ppdeli.market"
  PROFILE_NAME: "PPDELI App Store Distribution"

jobs:
  build-ios:
    name: Build PPDELI iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 3. CHECK TOOLS
      # ============================================================

      - name: Check Flutter Xcode CocoaPods
        run: |
          set -e

          echo "=========================================="
          echo "Flutter"
          echo "=========================================="

          flutter --version
          dart --version

          echo ""
          echo "=========================================="
          echo "Xcode"
          echo "=========================================="

          xcodebuild -version

          echo ""
          echo "=========================================="
          echo "CocoaPods"
          echo "=========================================="

          pod --version

      # ============================================================
      # 4. VERIFY PROJECT
      # ============================================================

      - name: Verify Flutter Project
        run: |
          set -e

          test -f pubspec.yaml
          test -d ios
          test -d ios/Runner.xcodeproj
          test -f ios/Podfile

          echo "Flutter project detected."
          echo "Bundle ID: $BUNDLE_ID"
          echo "Team ID: $APPLE_TEAM_ID"

      # ============================================================
      # 5. VERIFY SECRETS
      # ============================================================

      - name: Verify Signing Secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          if [ -z "$IOS_CERTIFICATE_BASE64" ]; then
            echo "ERROR: IOS_CERTIFICATE_BASE64 is empty."
            exit 1
          fi

          if [ -z "$IOS_CERTIFICATE_PASSWORD" ]; then
            echo "ERROR: IOS_CERTIFICATE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "ERROR: IOS_PROVISIONING_PROFILE_BASE64 is empty."
            exit 1
          fi

          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "ERROR: KEYCHAIN_PASSWORD is empty."
            exit 1
          fi

          echo "All required signing secrets are present."

      # ============================================================
      # 6. PREPARE SIGNING DIRECTORY
      # ============================================================

      - name: Prepare Signing Files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/ppdeli-signing"

          echo "Decoding Apple Distribution P12..."

          printf '%s' "$IOS_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12"

          echo "Decoding provisioning profile..."

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/ppdeli-signing/PPDELI_App_Store_Distribution.mobileprovision"

          echo ""
          echo "Signing files created."

          ls -lh "$RUNNER_TEMP/ppdeli-signing"

          echo ""
          echo "Checking P12 file type..."

          file "$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12"

          echo ""
          echo "Checking provisioning profile..."

          file "$RUNNER_TEMP/ppdeli-signing/PPDELI_App_Store_Distribution.mobileprovision"

      # ============================================================
      # 7. DISABLE FLUTTER SWIFT PACKAGE MANAGER
      # ============================================================

      - name: Disable Swift Package Manager
        run: |
          set -e

          flutter config --no-enable-swift-package-manager || true

          flutter config

      # ============================================================
      # 8. CLEAN PROJECT
      # ============================================================

      - name: Clean Flutter and iOS
        run: |
          set -e

          flutter clean

          rm -rf build
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh

          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.carthage.CarthageKit

          echo "Clean completed."

      # ============================================================
      # 9. FLUTTER PUB GET
      # ============================================================

      - name: Flutter Pub Get
        run: |
          set -e

          flutter pub get

          echo ""
          echo "Checking Generated.xcconfig..."

          test -f ios/Flutter/Generated.xcconfig

          ls -lh ios/Flutter/Generated.xcconfig

      # ============================================================
      # 10. POD INSTALL
      # ============================================================

      - name: Install iOS Pods
        working-directory: ios
        run: |
          set -e

          pod deintegrate || true

          rm -rf Pods
          rm -rf .symlinks

          echo "Installing CocoaPods dependencies..."

          pod install --repo-update

          test -d Pods
          test -d .symlinks

          echo "Pods installed successfully."

      # ============================================================
      # 11. CREATE BUILD DIRECTORIES
      # ============================================================

      - name: Prepare Build Directories
        run: |
          set -e

          mkdir -p build
          mkdir -p build/ios
          mkdir -p build/ios/SourcePackages

          echo "Build directories prepared."

      # ============================================================
      # 12. CREATE KEYCHAIN
      # ============================================================

      - name: Create Signing Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/ppdeli-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Creating temporary keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Keychain created successfully."

      # ============================================================
      # 13. VERIFY P12 PASSWORD BEFORE IMPORT
      # ============================================================

      - name: Verify P12
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          P12_FILE="$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12"

          echo "Testing P12 password..."

          openssl pkcs12 \
            -info \
            -in "$P12_FILE" \
            -noout \
            -passin "pass:$IOS_CERTIFICATE_PASSWORD"

          echo ""
          echo "P12 verification successful."

      # ============================================================
      # 14. IMPORT APPLE DISTRIBUTION CERTIFICATE
      # ============================================================

      - name: Import Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          P12_FILE="$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12"

          echo "Importing Apple Distribution certificate..."

          security import \
            "$P12_FILE" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          echo "Setting key partition list..."

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Available signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # ============================================================
      # 15. VERIFY APPLE DISTRIBUTION IDENTITY
      # ============================================================

      - name: Verify Apple Distribution Certificate
        run: |
          set -e

          echo "Searching for Apple Distribution identity..."

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          IDENTITY_COUNT=$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH" |
              grep -c "Apple Distribution" || true
          )

          echo ""
          echo "Apple Distribution identities: $IDENTITY_COUNT"

          if [ "$IDENTITY_COUNT" -lt 1 ]; then
            echo "ERROR: Apple Distribution certificate not found."
            exit 1
          fi

          echo "Apple Distribution certificate is available."

      # ============================================================
      # 16. READ PROVISIONING PROFILE
      # ============================================================

      - name: Read Provisioning Profile
        run: |
          set -e

          PROFILE_FILE="$RUNNER_TEMP/ppdeli-signing/PPDELI_App_Store_Distribution.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ppdeli-profile.plist"

          security cms \
            -D \
            -i "$PROFILE_FILE" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PROFILE_PLIST"
          )

          PROFILE_NAME_FROM_FILE=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PROFILE_PLIST"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$PROFILE_PLIST"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "Provisioning Profile"
          echo "=========================================="
          echo "Name:    $PROFILE_NAME_FROM_FILE"
          echo "UUID:    $PROFILE_UUID"
          echo "Team ID: $PROFILE_TEAM_ID"
          echo "App ID:  $PROFILE_APP_ID"
          echo "=========================================="

          EXPECTED_APP_ID="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          if [ "$PROFILE_NAME_FROM_FILE" != "$PROFILE_NAME" ]; then
            echo "ERROR: Provisioning Profile name mismatch."
            echo "Expected: $PROFILE_NAME"
            echo "Found:    $PROFILE_NAME_FROM_FILE"
            exit 1
          fi

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "ERROR: Team ID mismatch."
            echo "Expected: $APPLE_TEAM_ID"
            echo "Found:    $PROFILE_TEAM_ID"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERROR: Application ID mismatch."
            echo "Expected: $EXPECTED_APP_ID"
            echo "Found:    $PROFILE_APP_ID"
            exit 1
          fi

          echo ""
          echo "Provisioning profile is correct."

      # ============================================================
      # 17. INSTALL PROVISIONING PROFILE
      # ============================================================

      - name: Install Provisioning Profile
        run: |
          set -e

          PROFILE_FILE="$RUNNER_TEMP/ppdeli-signing/PPDELI_App_Store_Distribution.mobileprovision"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          cp \
            "$PROFILE_FILE" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "Installed provisioning profile:"
          ls -lh "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

      # ============================================================
      # 18. CREATE EXPORT OPTIONS
      # ============================================================

      - name: Create ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          PLIST

          echo "Checking ExportOptions.plist..."

          plutil -lint ios/ExportOptions.plist

          echo ""
          plutil -p ios/ExportOptions.plist

      # ============================================================
      # 19. VERIFY BUNDLE ID
      # ============================================================

      - name: Verify Bundle Identifier
        run: |
          set -e

          echo "Bundle identifiers in Xcode project:"

          grep -n \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            ios/Runner.xcodeproj/project.pbxproj \
            || true

          echo ""
          echo "Expected:"
          echo "$BUNDLE_ID"

          if ! grep -q "$BUNDLE_ID" ios/Runner.xcodeproj/project.pbxproj; then
            echo ""
            echo "ERROR: Expected Bundle ID was not found."
            exit 1
          fi

      # ============================================================
      # 20. FORCE MANUAL SIGNING
      # ============================================================

      - name: Verify Manual Signing Configuration
        run: |
          set -e

          echo "Checking signing configuration..."

          grep -n \
            -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_IDENTITY" \
            ios/Runner.xcodeproj/project.pbxproj \
            || true

          echo ""
          echo "Signing will be controlled by ExportOptions.plist."
          echo "Team: $APPLE_TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

      # ============================================================
      # 21. FINAL FLUTTER PREPARATION
      # ============================================================

      - name: Final Flutter Preparation
        run: |
          set -e

          flutter pub get

          test -f ios/Flutter/Generated.xcconfig
          test -d ios/Pods
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata

          mkdir -p build/ios/SourcePackages

          echo "Final preparation completed."

      # ============================================================
      # 22. BUILD IPA
      # ============================================================

      - name: Build Release IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "PPDELI iOS BUILD"
          echo "=========================================="

          echo "Bundle ID : $BUNDLE_ID"
          echo "Team ID   : $APPLE_TEAM_ID"
          echo "Profile   : $PROFILE_NAME"
          echo ""

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Starting Flutter IPA build..."

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            -v

      # ============================================================
      # 23. LOCATE IPA
      # ============================================================

      - name: Locate IPA
        run: |
          set -e

          echo "Searching for IPA..."

          find build \
            -type f \
            -name "*.ipa" \
            -print

          echo ""
          echo "Searching for XCArchive..."

          find build \
            -type d \
            -name "*.xcarchive" \
            -print

      # ============================================================
      # 24. VERIFY IPA
      # ============================================================

      - name: Verify IPA
        run: |
          set -e

          IPA_FILE=$(find build -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA file was generated."
            exit 1
          fi

          echo "IPA:"
          echo "$IPA_FILE"

          echo ""
          echo "IPA size:"
          ls -lh "$IPA_FILE"

          echo ""
          echo "Testing IPA archive..."

          unzip -t "$IPA_FILE" >/dev/null

          echo "IPA archive is valid."

      # ============================================================
      # 25. INSPECT IPA
      # ============================================================

      - name: Inspect IPA
        run: |
          set -e

          IPA_FILE=$(find build -type f -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q "$IPA_FILE" \
            -d "$RUNNER_TEMP/ipa-check"

          APP_PATH=$(find \
            "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" |
            head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found inside IPA."
            exit 1
          fi

          echo "Application:"
          echo "$APP_PATH"

          echo ""
          echo "Bundle identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo ""
          echo "Version:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist"

          echo ""
          echo "Build number:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP_PATH/Info.plist"

      # ============================================================
      # 26. UPLOAD IPA
      # ============================================================

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-release-ipa
          path: build/**/*.ipa
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 27. UPLOAD dSYM
      # ============================================================

      - name: Upload dSYM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-dsym
          path: |
            build/**/*.xcarchive/dSYMs/**
            build/ios/archive/**/*.dSYM/**
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 28. SUCCESS
      # ============================================================

      - name: Build Success
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "PPDELI iOS BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Bundle ID : $BUNDLE_ID"
          echo "Team ID   : $APPLE_TEAM_ID"
          echo "Profile   : $PROFILE_NAME"
          echo ""
          echo "IPA artifact:"
          echo "ppdeli-ios-release-ipa"
          echo ""
          echo "=========================================="

      # ============================================================
      # 29. CLEANUP
      # ============================================================

      - name: Cleanup Signing Keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
