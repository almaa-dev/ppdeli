name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"
  APPLE_TEAM_ID: "G54KQ62958"
  BUNDLE_ID: "com.ppdeli.market"
  PROFILE_NAME: "PPDELI App Store Distribution"

jobs:
  build-ios:
    name: Build Signed iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --------------------------------------------------
      # 3. Flutter dependencies
      # --------------------------------------------------
      - name: Flutter Pub Get
        run: |
          set -e

          flutter --version

          flutter config --no-enable-swift-package-manager || true

          flutter clean
          flutter pub get

      # --------------------------------------------------
      # 4. CocoaPods
      # --------------------------------------------------
      - name: Install CocoaPods
        run: |
          set -e

          cd ios

          pod install --repo-update

          cd ..

      # --------------------------------------------------
      # 5. Prepare signing directory
      # --------------------------------------------------
      - name: Prepare Signing Files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/ppdeli-signing"

          echo "$IOS_CERTIFICATE_BASE64" | base64 -D \
            > "$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D \
            > "$RUNNER_TEMP/ppdeli-signing/profile.mobileprovision"

          chmod 600 \
            "$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12" \
            "$RUNNER_TEMP/ppdeli-signing/profile.mobileprovision"

          echo "Signing files:"
          ls -lh "$RUNNER_TEMP/ppdeli-signing"

      # --------------------------------------------------
      # 6. Verify P12 BEFORE importing
      # --------------------------------------------------
      - name: Verify P12
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          P12_FILE="$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12"

          echo "Checking P12..."

          openssl pkcs12 \
            -in "$P12_FILE" \
            -noout \
            -passin env:IOS_CERTIFICATE_PASSWORD

          echo "✅ P12 password verified successfully."

      # --------------------------------------------------
      # 7. Verify provisioning profile
      # --------------------------------------------------
      - name: Verify Provisioning Profile
        run: |
          set -e

          PROFILE="$RUNNER_TEMP/ppdeli-signing/profile.mobileprovision"
          PLIST="$RUNNER_TEMP/ppdeli-signing/profile.plist"

          security cms \
            -D \
            -i "$PROFILE" \
            > "$PLIST"

          PROFILE_NAME=$( /usr/libexec/PlistBuddy \
            -c "Print :Name" "$PLIST" )

          TEAM_ID=$( /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" "$PLIST" )

          APP_ID=$( /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" "$PLIST" )

          UUID=$( /usr/libexec/PlistBuddy \
            -c "Print :UUID" "$PLIST" )

          echo "Profile Name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "App ID: $APP_ID"
          echo "UUID: $UUID"

          test "$PROFILE_NAME" = "$PROFILE_NAME"

          test "$TEAM_ID" = "${{ env.APPLE_TEAM_ID }}"
          test "$APP_ID" = "${{ env.APPLE_TEAM_ID }}.${{ env.BUNDLE_ID }}"

          echo "✅ Provisioning profile verified."

      # --------------------------------------------------
      # 8. Create temporary keychain
      # --------------------------------------------------
      - name: Create Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/ppdeli-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Importing Apple Distribution certificate..."

          security import \
            "$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          echo "Setting key partition list..."

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Available signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # --------------------------------------------------
      # 9. Install provisioning profile
      # --------------------------------------------------
      - name: Install Provisioning Profile
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          PROFILE="$RUNNER_TEMP/ppdeli-signing/profile.mobileprovision"

          UUID=$( /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/ppdeli-signing/profile.plist" )

          cp "$PROFILE" \
            "$PROFILE_DIR/$UUID.mobileprovision"

          echo "Installed profile:"
          echo "$UUID.mobileprovision"

      # --------------------------------------------------
      # 10. Create ExportOptions.plist
      # --------------------------------------------------
      - name: Create ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint ios/ExportOptions.plist

          echo "ExportOptions.plist:"
          cat ios/ExportOptions.plist

      # --------------------------------------------------
      # 11. Build unsigned archive
      # --------------------------------------------------
      - name: Build Unsigned Archive
        run: |
          set -e

          flutter build ipa \
            --release \
            --no-codesign

          echo "Archive files:"

          find build/ios/archive \
            -maxdepth 2 \
            -name "*.xcarchive" \
            -print

      # --------------------------------------------------
      # 12. Export and sign IPA
      # --------------------------------------------------
      - name: Sign and Export IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          ARCHIVE=$(find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "❌ XCArchive not found."
            exit 1
          fi

          echo "Archive:"
          echo "$ARCHIVE"

          rm -rf build/ios/ipa

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates

      # --------------------------------------------------
      # 13. Verify IPA
      # --------------------------------------------------
      - name: Verify IPA
        run: |
          set -e

          IPA=$(find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            -print -quit)

          if [ -z "$IPA" ]; then
            echo "❌ IPA was not created."
            exit 1
          fi

          echo "IPA:"
          echo "$IPA"

          ls -lh "$IPA"

          rm -rf "$RUNNER_TEMP/ipa-check"

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q "$IPA" \
            -d "$RUNNER_TEMP/ipa-check"

          APP="$RUNNER_TEMP/ipa-check/Payload/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "❌ Runner.app not found."
            exit 1
          fi

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo "Code signing information:"

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1 | grep -E \
            "Authority=|TeamIdentifier=|Identifier=" || true

          echo "✅ IPA verification completed."

      # --------------------------------------------------
      # 14. Upload IPA
      # --------------------------------------------------
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # 15. Cleanup
      # --------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          set +e

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          rm -rf "$RUNNER_TEMP/ppdeli-signing"

          echo "Cleanup completed."
