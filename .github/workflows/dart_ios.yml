name: Build PPDELI iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

  APPLE_TEAM_ID: "G54KQ62958"
  BUNDLE_ID: "com.ppdeli.market"
  PROFILE_NAME: "PPDELI App Store Distribution"

  P12_FILE: "ios/Singing/ios_distribution.p12"
  PROFILE_FILE: "ios/Singing/PPDELI_App_Store_Distribution.mobileprovision"

jobs:

  build-ios:

    name: Build PPDELI iOS IPA

    runs-on: macos-14

    timeout-minutes: 60

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. SETUP FLUTTER
      # =========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # =========================================================
      # 3. FLUTTER SETUP
      # =========================================================

      - name: Flutter Setup
        run: |
          set -e

          echo "=========================================="
          echo "FLUTTER VERSION"
          echo "=========================================="

          flutter --version

          echo "=========================================="
          echo "DISABLE SWIFT PACKAGE MANAGER"
          echo "=========================================="

          flutter config --no-enable-swift-package-manager || true

          echo "=========================================="
          echo "FLUTTER CLEAN"
          echo "=========================================="

          flutter clean

          echo "=========================================="
          echo "FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get


      # =========================================================
      # 4. CHECK SIGNING FILES
      # =========================================================

      - name: Check Apple Signing Files
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING APPLE SIGNING FILES"
          echo "=========================================="

          if [ ! -f "$P12_FILE" ]; then
            echo "❌ P12 FILE NOT FOUND"
            echo "$P12_FILE"
            exit 1
          fi

          if [ ! -f "$PROFILE_FILE" ]; then
            echo "❌ PROVISIONING PROFILE NOT FOUND"
            echo "$PROFILE_FILE"
            exit 1
          fi

          echo "✅ P12 found:"
          ls -lh "$P12_FILE"

          echo "✅ Provisioning Profile found:"
          ls -lh "$PROFILE_FILE"


      # =========================================================
      # 5. INSTALL COCOAPODS
      # =========================================================

      - name: Install CocoaPods
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING COCOAPODS"
          echo "=========================================="

          cd ios

          pod install --repo-update

          cd ..

          echo "✅ CocoaPods completed."


      # =========================================================
      # 6. PREPARE SIGNING DIRECTORY
      # =========================================================

      - name: Prepare Signing Files
        run: |
          set -e

          SIGNING_DIR="$RUNNER_TEMP/ppdeli-signing"

          mkdir -p "$SIGNING_DIR"

          cp "$P12_FILE" \
            "$SIGNING_DIR/ios_distribution.p12"

          cp "$PROFILE_FILE" \
            "$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision"

          chmod 600 \
            "$SIGNING_DIR/ios_distribution.p12"

          chmod 600 \
            "$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision"

          echo "SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "SIGNING FILES PREPARED"
          echo "=========================================="

          ls -lh "$SIGNING_DIR"


      # =========================================================
      # 7. VERIFY ORIGINAL P12
      # =========================================================

      - name: Verify Original P12
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          ORIGINAL="$SIGNING_DIR/ios_distribution.p12"

          echo "=========================================="
          echo "VERIFYING ORIGINAL P12"
          echo "=========================================="

          openssl pkcs12 \
            -in "$ORIGINAL" \
            -noout \
            -passin env:IOS_CERTIFICATE_PASSWORD

          echo "=========================================="
          echo "✅ ORIGINAL P12 IS VALID"
          echo "=========================================="


      # =========================================================
      # 8. REBUILD P12 FOR macOS KEYCHAIN
      # =========================================================

      - name: Rebuild P12 for macOS
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          ORIGINAL="$SIGNING_DIR/ios_distribution.p12"
          PEM="$SIGNING_DIR/certificate.pem"
          MACOS_P12="$SIGNING_DIR/macos_distribution.p12"

          echo "=========================================="
          echo "EXTRACTING CERTIFICATE AND PRIVATE KEY"
          echo "=========================================="

          openssl pkcs12 \
            -in "$ORIGINAL" \
            -nodes \
            -out "$PEM" \
            -passin env:IOS_CERTIFICATE_PASSWORD

          chmod 600 "$PEM"

          echo "=========================================="
          echo "CREATING MACOS-COMPATIBLE P12"
          echo "=========================================="

          openssl pkcs12 \
            -export \
            -in "$PEM" \
            -out "$MACOS_P12" \
            -passout env:IOS_CERTIFICATE_PASSWORD \
            -name "Apple Distribution"

          chmod 600 "$MACOS_P12"

          echo "=========================================="
          echo "VERIFYING NEW P12"
          echo "=========================================="

          openssl pkcs12 \
            -in "$MACOS_P12" \
            -noout \
            -passin env:IOS_CERTIFICATE_PASSWORD

          rm -f "$PEM"

          echo "MACOS_P12=$MACOS_P12" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "✅ NEW P12 CREATED SUCCESSFULLY"
          echo "=========================================="


      # =========================================================
      # 9. VERIFY PROVISIONING PROFILE
      # =========================================================

      - name: Verify Provisioning Profile
        run: |
          set -e

          PROFILE="$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision"
          PLIST="$SIGNING_DIR/profile.plist"

          echo "=========================================="
          echo "VERIFYING PROVISIONING PROFILE"
          echo "=========================================="

          security cms \
            -D \
            -i "$PROFILE" \
            > "$PLIST"

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PLIST"
          )

          TEAM_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$PLIST"
          )

          APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$PLIST"
          )

          UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PLIST"
          )

          echo "Profile Name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "App ID: $APP_ID"
          echo "UUID: $UUID"

          echo "=========================================="
          echo "CHECKING PROFILE"
          echo "=========================================="

          if [ "$PROFILE_NAME" != "$PROFILE_NAME" ]; then
            echo "❌ Invalid profile name"
            exit 1
          fi

          if [ "$TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "❌ Wrong Team ID"
            echo "Expected: $APPLE_TEAM_ID"
            echo "Found: $TEAM_ID"
            exit 1
          fi

          if [ "$APP_ID" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]; then
            echo "❌ Wrong Application Identifier"
            echo "Expected: ${APPLE_TEAM_ID}.${BUNDLE_ID}"
            echo "Found: $APP_ID"
            exit 1
          fi

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "✅ PROVISIONING PROFILE IS VALID"
          echo "=========================================="


      # =========================================================
      # 10. CREATE TEMPORARY KEYCHAIN
      # =========================================================

      - name: Create Temporary Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/ppdeli-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "CREATING TEMPORARY KEYCHAIN"
          echo "=========================================="

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "✅ KEYCHAIN CREATED"
          echo "=========================================="


      # =========================================================
      # 11. IMPORT REBUILT P12
      # =========================================================

      - name: Import Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "IMPORTING APPLE DISTRIBUTION CERTIFICATE"
          echo "=========================================="

          if [ ! -f "$MACOS_P12" ]; then
            echo "❌ Rebuilt P12 not found"
            exit 1
          fi

          echo "P12 file:"
          ls -lh "$MACOS_P12"

          echo "=========================================="
          echo "SECURITY IMPORT"
          echo "=========================================="

          security import \
            "$MACOS_P12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          echo "=========================================="
          echo "SETTING KEY PARTITION LIST"
          echo "=========================================="

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "VERIFYING CODE SIGNING IDENTITY"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "✅ APPLE DISTRIBUTION CERTIFICATE IMPORTED"
          echo "=========================================="


      # =========================================================
      # 12. INSTALL PROVISIONING PROFILE
      # =========================================================

      - name: Install Provisioning Profile
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          cp \
            "$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "=========================================="
          echo "PROVISIONING PROFILE INSTALLED"
          echo "=========================================="

          echo "UUID: $PROFILE_UUID"

          ls -lh \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"


      # =========================================================
      # 13. CREATE EXPORT OPTIONS
      # =========================================================

      - name: Create ExportOptions.plist
        run: |
          set -e

          echo "=========================================="
          echo "CREATING EXPORTOPTIONS.PLIST"
          echo "=========================================="

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          plutil -lint ios/ExportOptions.plist

          echo "=========================================="
          echo "✅ EXPORTOPTIONS.PLIST CREATED"
          echo "=========================================="


      # =========================================================
      # 14. CHECK XCODE SIGNING SETTINGS
      # =========================================================

      - name: Check Xcode Signing
        run: |
          set -e

          echo "=========================================="
          echo "XCODE SIGNING SETTINGS"
          echo "=========================================="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY" \
            || true


      # =========================================================
      # 15. BUILD UNSIGNED ARCHIVE
      # =========================================================

      - name: Build Unsigned XCArchive
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING UNSIGNED XCARCHIVE"
          echo "=========================================="

          flutter build ipa \
            --release \
            --no-codesign

          echo "=========================================="
          echo "SEARCHING FOR XCARCHIVE"
          echo "=========================================="

          find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print

          echo "=========================================="
          echo "✅ XCARCHIVE BUILD COMPLETE"
          echo "=========================================="


      # =========================================================
      # 16. EXPORT SIGNED IPA
      # =========================================================

      - name: Sign and Export IPA
        run: |
          set -e

          echo "=========================================="
          echo "FINDING XCARCHIVE"
          echo "=========================================="

          ARCHIVE=$(
            find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print -quit
          )

          if [ -z "$ARCHIVE" ]; then
            echo "❌ XCARCHIVE NOT FOUND"
            exit 1
          fi

          echo "Archive:"
          echo "$ARCHIVE"

          echo "=========================================="
          echo "EXPORTING SIGNED IPA"
          echo "=========================================="

          rm -rf build/ios/ipa

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

          echo "=========================================="
          echo "✅ SIGNED IPA EXPORT COMPLETE"
          echo "=========================================="


      # =========================================================
      # 17. VERIFY IPA
      # =========================================================

      - name: Verify IPA
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING IPA"
          echo "=========================================="

          IPA=$(
            find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            -print -quit
          )

          if [ -z "$IPA" ]; then
            echo "❌ IPA NOT FOUND"
            exit 1
          fi

          echo "IPA:"
          ls -lh "$IPA"

          CHECK="$RUNNER_TEMP/ipa-check"

          rm -rf "$CHECK"

          mkdir -p "$CHECK"

          unzip -q "$IPA" -d "$CHECK"

          APP="$CHECK/Payload/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "❌ RUNNER.APP NOT FOUND"
            exit 1
          fi

          echo "=========================================="
          echo "BUNDLE IDENTIFIER"
          echo "=========================================="

          BUNDLE=$(
            /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"
          )

          echo "Bundle ID: $BUNDLE"

          if [ "$BUNDLE" != "$BUNDLE_ID" ]; then
            echo "❌ WRONG BUNDLE ID"
            exit 1
          fi

          echo "=========================================="
          echo "CODE SIGNATURE"
          echo "=========================================="

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1 \
            | grep -E \
            "Identifier=|Authority=|TeamIdentifier=" \
            || true

          echo "=========================================="
          echo "✅ IPA VERIFIED SUCCESSFULLY"
          echo "=========================================="


      # =========================================================
      # 18. UPLOAD IPA
      # =========================================================

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # 19. CLEANUP
      # =========================================================

      - name: Cleanup
        if: always()
        run: |
          set +e

          echo "=========================================="
          echo "CLEANUP"
          echo "=========================================="

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          if [ -n "${SIGNING_DIR:-}" ]; then
            rm -rf "$SIGNING_DIR"
          fi

          echo "✅ CLEANUP COMPLETE"
