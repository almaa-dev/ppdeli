name: Build PPDELI iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

  APPLE_TEAM_ID: "G54KQ62958"
  BUNDLE_ID: "com.ppdeli.market"
  PROFILE_NAME: "PPDELI App Store Distribution"

  P12_FILE: "ios/Singing/ios_distribution.p12"
  PROFILE_FILE: "ios/Singing/PPDELI_App_Store_Distribution.mobileprovision"

jobs:

  build-ios:

    name: Build PPDELI iOS IPA

    runs-on: macos-26

    timeout-minutes: 60

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. SELECT XCODE
      # =========================================================

      - name: Select Xcode
        run: |
          set -e

          echo "=========================================="
          echo "AVAILABLE XCODE VERSIONS"
          echo "=========================================="

          ls -d /Applications/Xcode*.app 2>/dev/null || true

          echo "=========================================="
          echo "SELECTING XCODE"
          echo "=========================================="

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.4.app/Contents/Developer"

          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.3.app/Contents/Developer"

          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.2.app/Contents/Developer"

          else
            echo "No explicit Xcode 16.x installation found."
            echo "Using default Xcode."
          fi

          echo "=========================================="
          echo "XCODE VERSION"
          echo "=========================================="

          xcodebuild -version

          echo "=========================================="
          echo "SWIFT VERSION"
          echo "=========================================="

          swift --version

          echo "=========================================="
          echo "XCODE PATH"
          echo "=========================================="

          xcode-select -p


      # =========================================================
      # 3. SETUP FLUTTER
      # =========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # =========================================================
      # 4. FLUTTER SETUP
      # =========================================================

      - name: Flutter Setup
        run: |
          set -e

          echo "=========================================="
          echo "FLUTTER VERSION"
          echo "=========================================="

          flutter --version

          echo "=========================================="
          echo "FLUTTER CONFIG"
          echo "=========================================="

          flutter config --no-enable-swift-package-manager || true

          echo "=========================================="
          echo "FLUTTER CLEAN"
          echo "=========================================="

          flutter clean


      # =========================================================
      # 5. CHECK SIGNING FILES
      # =========================================================

      - name: Check Apple Signing Files
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING APPLE SIGNING FILES"
          echo "=========================================="

          if [ ! -f "$P12_FILE" ]; then
            echo "❌ P12 FILE NOT FOUND"
            echo "$P12_FILE"
            exit 1
          fi

          if [ ! -f "$PROFILE_FILE" ]; then
            echo "❌ PROVISIONING PROFILE NOT FOUND"
            echo "$PROFILE_FILE"
            exit 1
          fi

          echo "✅ P12 found:"
          ls -lh "$P12_FILE"

          echo "✅ Provisioning Profile found:"
          ls -lh "$PROFILE_FILE"


      # =========================================================
      # 6. FLUTTER PUB GET
      # =========================================================

      - name: Flutter Pub Get
        run: |
          set -e

          echo "=========================================="
          echo "FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get


      # =========================================================
      # 7. PREPARE PODFILE FOR FIREBASE SWIFT COMPATIBILITY
      # =========================================================

      - name: Configure Firebase Swift Compatibility
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURING FIREBASE SWIFT COMPATIBILITY"
          echo "=========================================="

          PODFILE="ios/Podfile"

          if [ ! -f "$PODFILE" ]; then
            echo "❌ Podfile not found"
            exit 1
          fi

          cp "$PODFILE" "$RUNNER_TEMP/Podfile.backup"

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Podfile")
          text = path.read_text()

          marker = "# PPDELI_FIREBASE_SWIFT_COMPATIBILITY"

          if marker not in text:

              block = r'''

          # PPDELI_FIREBASE_SWIFT_COMPATIBILITY
          #
          # FirebaseCoreInternal uses Swift features such as scoped imports
          # and sending. Enable the required Swift compiler feature for
          # Firebase targets when using a compatible Xcode/Swift toolchain.

          post_install do |installer|
            installer.pods_project.targets.each do |target|

              if [
                'FirebaseCoreInternal',
                'FirebaseSessions'
              ].include?(target.name)

                target.build_configurations.each do |config|

                  flags = config.build_settings['OTHER_SWIFT_FLAGS']

                  if flags.nil?
                    flags = ['$(inherited)']
                  elsif flags.is_a?(String)
                    flags = [flags]
                  end

                  unless flags.include?('-enable-experimental-feature')
                    flags << '-enable-experimental-feature'
                  end

                  unless flags.include?('AccessLevelOnImport')
                    flags << 'AccessLevelOnImport'
                  end

                  config.build_settings['OTHER_SWIFT_FLAGS'] = flags

                end
              end

            end
          end
          '''

              if "post_install do |installer|" in text:

                  old = "post_install do |installer|"

                  replacement = """post_install do |installer|

            # PPDELI_FIREBASE_SWIFT_COMPATIBILITY
            installer.pods_project.targets.each do |target|
              if ['FirebaseCoreInternal', 'FirebaseSessions'].include?(target.name)
                target.build_configurations.each do |config|
                  flags = config.build_settings['OTHER_SWIFT_FLAGS']

                  if flags.nil?
                    flags = ['$(inherited)']
                  elsif flags.is_a?(String)
                    flags = [flags]
                  end

                  unless flags.include?('-enable-experimental-feature')
                    flags << '-enable-experimental-feature'
                  end

                  unless flags.include?('AccessLevelOnImport')
                    flags << 'AccessLevelOnImport'
                  end

                  config.build_settings['OTHER_SWIFT_FLAGS'] = flags
                end
              end
            end
          """

                  text = text.replace(old, replacement, 1)

              else:
                  text += block

              path.write_text(text)

          print("Podfile updated for Firebase Swift compatibility.")
          PY

          echo "=========================================="
          echo "PODFILE FIREBASE SETTINGS"
          echo "=========================================="

          grep -n -A60 -B5 \
            "PPDELI_FIREBASE_SWIFT_COMPATIBILITY" \
            "$PODFILE" || true


      # =========================================================
      # 8. PREPARE SIGNING DIRECTORY
      # =========================================================

      - name: Prepare Signing Files
        run: |
          set -e

          SIGNING_DIR="$RUNNER_TEMP/ppdeli-signing"

          mkdir -p "$SIGNING_DIR"

          cp "$P12_FILE" \
            "$SIGNING_DIR/ios_distribution.p12"

          cp "$PROFILE_FILE" \
            "$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision"

          chmod 600 \
            "$SIGNING_DIR/ios_distribution.p12"

          chmod 600 \
            "$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision"

          echo "SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "SIGNING FILES PREPARED"
          echo "=========================================="

          ls -lh "$SIGNING_DIR"


      # =========================================================
      # 9. VERIFY ORIGINAL P12
      # =========================================================

      - name: Verify Original P12
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          ORIGINAL="$SIGNING_DIR/ios_distribution.p12"

          echo "=========================================="
          echo "VERIFYING ORIGINAL P12"
          echo "=========================================="

          openssl pkcs12 \
            -in "$ORIGINAL" \
            -noout \
            -passin env:IOS_CERTIFICATE_PASSWORD

          echo "=========================================="
          echo "✅ ORIGINAL P12 IS VALID"
          echo "=========================================="


      # =========================================================
      # 10. REBUILD P12 FOR macOS KEYCHAIN
      # =========================================================

      - name: Rebuild P12 for macOS
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          ORIGINAL="$SIGNING_DIR/ios_distribution.p12"
          PEM="$SIGNING_DIR/certificate.pem"
          MACOS_P12="$SIGNING_DIR/macos_distribution.p12"

          echo "=========================================="
          echo "EXTRACTING CERTIFICATE AND PRIVATE KEY"
          echo "=========================================="

          openssl pkcs12 \
            -in "$ORIGINAL" \
            -nodes \
            -out "$PEM" \
            -passin env:IOS_CERTIFICATE_PASSWORD

          chmod 600 "$PEM"

          echo "=========================================="
          echo "CREATING MACOS-COMPATIBLE P12"
          echo "=========================================="

          openssl pkcs12 \
            -export \
            -in "$PEM" \
            -out "$MACOS_P12" \
            -passout env:IOS_CERTIFICATE_PASSWORD \
            -name "Apple Distribution"

          chmod 600 "$MACOS_P12"

          echo "=========================================="
          echo "VERIFYING NEW P12"
          echo "=========================================="

          openssl pkcs12 \
            -in "$MACOS_P12" \
            -noout \
            -passin env:IOS_CERTIFICATE_PASSWORD

          rm -f "$PEM"

          echo "MACOS_P12=$MACOS_P12" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "✅ NEW P12 CREATED SUCCESSFULLY"
          echo "=========================================="


      # =========================================================
      # 11. VERIFY PROVISIONING PROFILE
      # =========================================================

      - name: Verify Provisioning Profile
        run: |
          set -e

          PROFILE="$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision"
          PLIST="$SIGNING_DIR/profile.plist"

          echo "=========================================="
          echo "VERIFYING PROVISIONING PROFILE"
          echo "=========================================="

          security cms \
            -D \
            -i "$PROFILE" \
            > "$PLIST"

          ACTUAL_PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PLIST"
          )

          TEAM_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$PLIST"
          )

          APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$PLIST"
          )

          UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PLIST"
          )

          echo "Profile Name: $ACTUAL_PROFILE_NAME"
          echo "Expected Name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "App ID: $APP_ID"
          echo "UUID: $UUID"

          echo "=========================================="
          echo "CHECKING PROFILE"
          echo "=========================================="

          if [ "$ACTUAL_PROFILE_NAME" != "$PROFILE_NAME" ]; then
            echo "❌ Invalid profile name"
            echo "Expected: $PROFILE_NAME"
            echo "Found: $ACTUAL_PROFILE_NAME"
            exit 1
          fi

          if [ "$TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "❌ Wrong Team ID"
            echo "Expected: $APPLE_TEAM_ID"
            echo "Found: $TEAM_ID"
            exit 1
          fi

          if [ "$APP_ID" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]; then
            echo "❌ Wrong Application Identifier"
            echo "Expected: ${APPLE_TEAM_ID}.${BUNDLE_ID}"
            echo "Found: $APP_ID"
            exit 1
          fi

          PROFILE_UUID="$UUID"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "✅ PROVISIONING PROFILE IS VALID"
          echo "=========================================="


      # =========================================================
      # 12. CREATE TEMPORARY KEYCHAIN
      # =========================================================

      - name: Create Temporary Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/ppdeli-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "CREATING TEMPORARY KEYCHAIN"
          echo "=========================================="

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "✅ KEYCHAIN CREATED"
          echo "=========================================="


      # =========================================================
      # 13. IMPORT APPLE DISTRIBUTION CERTIFICATE
      # =========================================================

      - name: Import Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "IMPORTING APPLE DISTRIBUTION CERTIFICATE"
          echo "=========================================="

          if [ ! -f "$MACOS_P12" ]; then
            echo "❌ Rebuilt P12 not found"
            exit 1
          fi

          security import \
            "$MACOS_P12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          echo "=========================================="
          echo "SETTING KEY PARTITION LIST"
          echo "=========================================="

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "VERIFYING CODE SIGNING IDENTITY"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "✅ APPLE DISTRIBUTION CERTIFICATE IMPORTED"
          echo "=========================================="


      # =========================================================
      # 14. INSTALL PROVISIONING PROFILE
      # =========================================================

      - name: Install Provisioning Profile
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          cp \
            "$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "=========================================="
          echo "PROVISIONING PROFILE INSTALLED"
          echo "=========================================="

          echo "UUID: $PROFILE_UUID"

          ls -lh \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"


      # =========================================================
      # 15. CREATE EXPORT OPTIONS
      # =========================================================

      - name: Create ExportOptions.plist
        run: |
          set -e

          echo "=========================================="
          echo "CREATING EXPORTOPTIONS.PLIST"
          echo "=========================================="

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          plutil -lint ios/ExportOptions.plist

          echo "=========================================="
          echo "✅ EXPORTOPTIONS.PLIST CREATED"
          echo "=========================================="


      # =========================================================
      # 16. INSTALL COCOAPODS CLEANLY
      # =========================================================

      - name: Install CocoaPods Cleanly
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING COCOAPODS"
          echo "=========================================="

          cd ios

          rm -rf Pods
          rm -f Podfile.lock

          pod deintegrate || true

          cd ..

          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

          echo "=========================================="
          echo "INSTALLING COCOAPODS"
          echo "=========================================="

          cd ios

          pod repo update
          pod install --repo-update

          cd ..

          echo "=========================================="
          echo "CHECKING FIREBASE PODS"
          echo "=========================================="

          grep -A5 -B2 \
            "FirebaseCoreInternal" \
            ios/Podfile.lock || true

          echo "=========================================="
          echo "✅ COCOAPODS INSTALL COMPLETE"
          echo "=========================================="


      # =========================================================
      # 17. VERIFY POD SWIFT FLAGS
      # =========================================================

      - name: Verify Firebase Swift Flags
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING FIREBASE SWIFT FLAGS"
          echo "=========================================="

          grep -R \
            "AccessLevelOnImport" \
            ios/Pods/Target\ Support\ Files \
            2>/dev/null \
            | head -50 \
            || true

          echo "=========================================="
          echo "XCODE VERSION"
          echo "=========================================="

          xcodebuild -version

          echo "=========================================="
          echo "SWIFT VERSION"
          echo "=========================================="

          swift --version


      # =========================================================
      # 18. CHECK XCODE SIGNING SETTINGS
      # =========================================================

      - name: Check Xcode Signing
        run: |
          set -e

          echo "=========================================="
          echo "XCODE SIGNING SETTINGS"
          echo "=========================================="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY" \
            || true


      # =========================================================
      # 19. BUILD UNSIGNED XCARCHIVE
      # =========================================================

      - name: Build Unsigned XCArchive
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING UNSIGNED XCARCHIVE"
          echo "=========================================="

          flutter build ipa \
            --release \
            --no-codesign

          echo "=========================================="
          echo "SEARCHING FOR XCARCHIVE"
          echo "=========================================="

          find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print

          echo "=========================================="
          echo "✅ XCARCHIVE BUILD COMPLETE"
          echo "=========================================="


      # =========================================================
      # 20. EXPORT SIGNED IPA
      # =========================================================

      - name: Sign and Export IPA
        run: |
          set -e

          echo "=========================================="
          echo "FINDING XCARCHIVE"
          echo "=========================================="

          ARCHIVE=$(
            find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print -quit
          )

          if [ -z "$ARCHIVE" ]; then
            echo "❌ XCARCHIVE NOT FOUND"
            exit 1
          fi

          echo "Archive:"
          echo "$ARCHIVE"

          echo "=========================================="
          echo "EXPORTING SIGNED IPA"
          echo "=========================================="

          rm -rf build/ios/ipa

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

          echo "=========================================="
          echo "✅ SIGNED IPA EXPORT COMPLETE"
          echo "=========================================="


      # =========================================================
      # 21. VERIFY IPA
      # =========================================================

      - name: Verify IPA
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING IPA"
          echo "=========================================="

          IPA=$(
            find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            -print -quit
          )

          if [ -z "$IPA" ]; then
            echo "❌ IPA NOT FOUND"
            exit 1
          fi

          echo "IPA:"
          ls -lh "$IPA"

          CHECK="$RUNNER_TEMP/ipa-check"

          rm -rf "$CHECK"

          mkdir -p "$CHECK"

          unzip -q "$IPA" -d "$CHECK"

          APP="$CHECK/Payload/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "❌ RUNNER.APP NOT FOUND"
            exit 1
          fi

          echo "=========================================="
          echo "BUNDLE IDENTIFIER"
          echo "=========================================="

          BUNDLE=$(
            /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"
          )

          echo "Bundle ID: $BUNDLE"

          if [ "$BUNDLE" != "$BUNDLE_ID" ]; then
            echo "❌ WRONG BUNDLE ID"
            exit 1
          fi

          echo "=========================================="
          echo "CODE SIGNATURE"
          echo "=========================================="

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1 \
            | grep -E \
            "Identifier=|Authority=|TeamIdentifier=" \
            || true

          echo "=========================================="
          echo "VERIFYING EMBEDDED PROVISIONING PROFILE"
          echo "=========================================="

          if [ ! -f "$APP/embedded.mobileprovision" ]; then
            echo "❌ embedded.mobileprovision NOT FOUND"
            exit 1
          fi

          security cms \
            -D \
            -i "$APP/embedded.mobileprovision" \
            > "$CHECK/embedded.plist"

          EMBEDDED_APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$CHECK/embedded.plist"
          )

          echo "Embedded App ID: $EMBEDDED_APP_ID"

          if [ "$EMBEDDED_APP_ID" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]; then
            echo "❌ WRONG EMBEDDED APPLICATION IDENTIFIER"
            exit 1
          fi

          echo "=========================================="
          echo "✅ IPA VERIFIED SUCCESSFULLY"
          echo "=========================================="


      # =========================================================
      # 22. UPLOAD IPA TO APP STORE CONNECT
      # =========================================================

      - name: Upload IPA to App Store Connect
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "UPLOADING IPA TO APP STORE CONNECT"
          echo "=========================================="

          IPA=$(
            find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            -print -quit
          )

          if [ -z "$IPA" ]; then
            echo "❌ IPA NOT FOUND"
            exit 1
          fi

          echo "IPA:"
          ls -lh "$IPA"

          if [ -z "$APPSTORE_ISSUER_ID" ]; then
            echo "❌ APPSTORE_ISSUER_ID SECRET IS EMPTY"
            exit 1
          fi

          if [ -z "$APPSTORE_KEY_ID" ]; then
            echo "❌ APPSTORE_KEY_ID SECRET IS EMPTY"
            exit 1
          fi

          if [ -z "$APPSTORE_PRIVATE_KEY" ]; then
            echo "❌ APPSTORE_PRIVATE_KEY SECRET IS EMPTY"
            exit 1
          fi

          echo "=========================================="
          echo "CREATING APP STORE CONNECT API KEY"
          echo "=========================================="

          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"

          mkdir -p "$API_KEY_DIR"

          API_KEY_FILE="$API_KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$API_KEY_FILE"

          chmod 600 "$API_KEY_FILE"

          if [ ! -s "$API_KEY_FILE" ]; then
            echo "❌ API KEY FILE IS EMPTY"
            exit 1
          fi

          echo "API Key prepared."

          echo "=========================================="
          echo "VALIDATING IPA WITH APP STORE CONNECT"
          echo "=========================================="

          xcrun altool \
            --validate-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

          echo "=========================================="
          echo "VALIDATION SUCCESSFUL"
          echo "=========================================="

          echo "=========================================="
          echo "UPLOADING IPA"
          echo "=========================================="

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

          echo "=========================================="
          echo "✅ IPA UPLOAD COMPLETED"
          echo "=========================================="


      # =========================================================
      # 23. UPLOAD IPA ARTIFACT
      # =========================================================

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # 24. CLEANUP
      # =========================================================

      - name: Cleanup
        if: always()
        run: |
          set +e

          echo "=========================================="
          echo "CLEANUP"
          echo "=========================================="

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          if [ -n "${SIGNING_DIR:-}" ]; then
            rm -rf "$SIGNING_DIR"
          fi

          rm -rf "$HOME/.appstoreconnect/private_keys"

          echo "✅ CLEANUP COMPLETE"
