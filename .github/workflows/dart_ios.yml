name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"
  APPLE_TEAM_ID: "G54KQ62958"
  BUNDLE_ID: "com.ppdeli.market"
  PROFILE_NAME: "PPDELI App Store Distribution"

jobs:
  build-ios:
    name: Build PPDELI iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ==========================================
      # 3. Flutter dependencies
      # ==========================================
      - name: Flutter Setup
        run: |
          set -e

          flutter --version

          flutter config --no-enable-swift-package-manager || true

          flutter clean
          flutter pub get

      # ==========================================
      # 4. CocoaPods
      # ==========================================
      - name: Install CocoaPods
        run: |
          set -e

          cd ios
          pod install --repo-update
          cd ..

      # ==========================================
      # 5. Decode signing files
      # ==========================================
      - name: Decode Apple Signing Files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          SIGNING_DIR="$RUNNER_TEMP/ppdeli-signing"

          mkdir -p "$SIGNING_DIR"

          echo "Decoding P12..."

          echo "$IOS_CERTIFICATE_BASE64" | base64 -D \
            > "$SIGNING_DIR/original.p12"

          echo "Decoding provisioning profile..."

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D \
            > "$SIGNING_DIR/profile.mobileprovision"

          chmod 600 "$SIGNING_DIR/original.p12"
          chmod 600 "$SIGNING_DIR/profile.mobileprovision"

          ls -lh "$SIGNING_DIR"

      # ==========================================
      # 6. Verify original P12
      # ==========================================
      - name: Verify Original P12
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          P12="$RUNNER_TEMP/ppdeli-signing/original.p12"

          echo "=========================================="
          echo "VERIFYING ORIGINAL P12"
          echo "=========================================="

          openssl pkcs12 \
            -in "$P12" \
            -noout \
            -passin env:IOS_CERTIFICATE_PASSWORD

          echo "✅ Original P12 password is VALID."

      # ==========================================
      # 7. Convert P12 to legacy-compatible format
      # ==========================================
      - name: Repackage P12 for macOS
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          SIGNING_DIR="$RUNNER_TEMP/ppdeli-signing"

          ORIGINAL="$SIGNING_DIR/original.p12"
          PEM="$SIGNING_DIR/certificate.pem"
          P12="$SIGNING_DIR/ios_distribution.p12"

          echo "=========================================="
          echo "EXTRACTING CERTIFICATE AND PRIVATE KEY"
          echo "=========================================="

          openssl pkcs12 \
            -legacy \
            -in "$ORIGINAL" \
            -nodes \
            -out "$PEM" \
            -passin env:IOS_CERTIFICATE_PASSWORD

          chmod 600 "$PEM"

          echo "=========================================="
          echo "CREATING MACOS-COMPATIBLE P12"
          echo "=========================================="

          openssl pkcs12 \
            -export \
            -legacy \
            -in "$PEM" \
            -out "$P12" \
            -passout env:IOS_CERTIFICATE_PASSWORD \
            -name "Apple Distribution"

          chmod 600 "$P12"

          echo "Testing new P12..."

          openssl pkcs12 \
            -legacy \
            -in "$P12" \
            -noout \
            -passin env:IOS_CERTIFICATE_PASSWORD

          echo "✅ Compatible P12 created."

          rm -f "$PEM"

      # ==========================================
      # 8. Verify provisioning profile
      # ==========================================
      - name: Verify Provisioning Profile
        run: |
          set -e

          PROFILE="$RUNNER_TEMP/ppdeli-signing/profile.mobileprovision"
          PLIST="$RUNNER_TEMP/ppdeli-signing/profile.plist"

          security cms \
            -D \
            -i "$PROFILE" \
            > "$PLIST"

          PROFILE_NAME=$( \
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PLIST"
          )

          TEAM_ID=$( \
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$PLIST"
          )

          APP_ID=$( \
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$PLIST"
          )

          UUID=$( \
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PLIST"
          )

          echo "Profile: $PROFILE_NAME"
          echo "Team: $TEAM_ID"
          echo "App ID: $APP_ID"
          echo "UUID: $UUID"

          test "$PROFILE_NAME" = "${{ env.PROFILE_NAME }}"
          test "$TEAM_ID" = "${{ env.APPLE_TEAM_ID }}"
          test "$APP_ID" = "${{ env.APPLE_TEAM_ID }}.${{ env.BUNDLE_ID }}"

          echo "✅ Provisioning profile is VALID."

      # ==========================================
      # 9. Create Keychain and import P12
      # ==========================================
      - name: Create Keychain and Import Certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/ppdeli-signing.keychain-db"
          P12_FILE="$RUNNER_TEMP/ppdeli-signing/ios_distribution.p12"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "CREATING KEYCHAIN"
          echo "=========================================="

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "IMPORTING CERTIFICATE"
          echo "=========================================="

          security import \
            "$P12_FILE" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          echo "Setting partition list..."

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "=========================================="
          echo "SIGNING IDENTITIES"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "✅ Apple Distribution certificate imported."

      # ==========================================
      # 10. Install provisioning profile
      # ==========================================
      - name: Install Provisioning Profile
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/ppdeli-signing/profile.plist"
          )

          cp \
            "$RUNNER_TEMP/ppdeli-signing/profile.mobileprovision" \
            "$PROFILE_DIR/$UUID.mobileprovision"

          echo "Installed profile:"
          echo "$UUID.mobileprovision"

      # ==========================================
      # 11. ExportOptions
      # ==========================================
      - name: Create ExportOptions
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint ios/ExportOptions.plist

      # ==========================================
      # 12. Build unsigned archive
      # ==========================================
      - name: Build Unsigned Archive
        run: |
          set -e

          flutter build ipa \
            --release \
            --no-codesign

          echo "Archives:"

          find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print

      # ==========================================
      # 13. Sign and export IPA
      # ==========================================
      - name: Sign and Export IPA
        run: |
          set -e

          ARCHIVE=$(
            find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print -quit
          )

          if [ -z "$ARCHIVE" ]; then
            echo "❌ XCArchive not found."
            exit 1
          fi

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa

          echo "Exporting signed IPA..."

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

      # ==========================================
      # 14. Verify IPA
      # ==========================================
      - name: Verify IPA
        run: |
          set -e

          IPA=$(
            find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            -print -quit
          )

          if [ -z "$IPA" ]; then
            echo "❌ IPA not found."
            exit 1
          fi

          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh "$IPA"

          CHECK="$RUNNER_TEMP/ipa-check"

          rm -rf "$CHECK"
          mkdir -p "$CHECK"

          unzip -q "$IPA" -d "$CHECK"

          APP="$CHECK/Payload/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "❌ Runner.app not found."
            exit 1
          fi

          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo "Signing information:"

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1 | grep -E \
            "Identifier=|Authority=|TeamIdentifier=" || true

          echo "=========================================="
          echo "✅ IPA VERIFIED"
          echo "=========================================="

      # ==========================================
      # 15. Upload IPA
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 16. Cleanup
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          set +e

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain \
              "$KEYCHAIN_PATH" || true
          fi

          rm -rf \
            "$RUNNER_TEMP/ppdeli-signing"

          echo "Cleanup completed."
