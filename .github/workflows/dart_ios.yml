name: Build PPDELI iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

  APPLE_TEAM_ID: "G54KQ62958"
  BUNDLE_ID: "com.ppdeli.market"
  PROFILE_NAME: "PPDELI App Store Distribution"

  P12_FILE: "ios/Singing/ios_distribution.p12"
  PROFILE_FILE: "ios/Singing/PPDELI_App_Store_Distribution.mobileprovision"

jobs:

  build-ios:

    name: Build PPDELI iOS IPA

    # macOS 26 contains Xcode 26.6
    runs-on: macos-26

    timeout-minutes: 90

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # SELECT XCODE 26
      # ============================================================

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SELECTING XCODE 26.6"
          echo "=========================================="

          XCODE_PATH="/Applications/Xcode_26.6.app"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode 26.6 not found."
            echo "Installed Xcode versions:"
            ls -la /Applications/ | grep Xcode || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          sudo xcodebuild -runFirstLaunch || true

          echo ""
          echo "XCODE VERSION:"
          xcodebuild -version

          echo ""
          echo "IOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          XCODE_VERSION=$(xcodebuild -version | awk '/Xcode/ {print $2}')
          IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)

          echo ""
          echo "XCODE_VERSION=$XCODE_VERSION"
          echo "IOS_SDK_VERSION=$IOS_SDK_VERSION"

          case "$XCODE_VERSION" in
            26.*)
              echo "Xcode 26 detected."
              ;;
            *)
              echo "ERROR: Xcode 26 or later is required."
              exit 1
              ;;
          esac

          case "$IOS_SDK_VERSION" in
            26.*|27.*|28.*)
              echo "iOS 26+ SDK detected."
              ;;
            *)
              echo "ERROR: iOS 26 SDK or later is required."
              exit 1
              ;;
          esac


      # ============================================================
      # SETUP FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # ============================================================
      # VERIFY FLUTTER / XCODE
      # ============================================================

      - name: Verify Flutter environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING BUILD ENVIRONMENT"
          echo "=========================================="

          flutter --version

          echo ""
          flutter doctor -v

          echo ""
          echo "XCODE:"
          xcodebuild -version

          echo ""
          echo "IOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version


      # ============================================================
      # FLUTTER CLEAN
      # ============================================================

      - name: Flutter clean
        shell: bash
        run: |
          set -e

          flutter clean

          rm -rf build

          rm -rf ios/Pods
          rm -rf ios/.symlinks

          rm -f ios/Podfile.lock


      # ============================================================
      # GET FLUTTER PACKAGES
      # ============================================================

      - name: Flutter pub get
        shell: bash
        run: |
          set -e

          flutter pub get


      # ============================================================
      # CHECK SIGNING FILES
      # ============================================================

      - name: Check Apple signing files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING APPLE SIGNING FILES"
          echo "=========================================="

          if [ ! -f "${P12_FILE}" ]; then
            echo "ERROR: P12 file not found:"
            echo "${P12_FILE}"
            exit 1
          fi

          if [ ! -f "${PROFILE_FILE}" ]; then
            echo "ERROR: Provisioning profile not found:"
            echo "${PROFILE_FILE}"
            exit 1
          fi

          echo "P12:"
          ls -lh "${P12_FILE}"

          echo ""
          echo "Provisioning Profile:"
          ls -lh "${PROFILE_FILE}"


      # ============================================================
      # FIX APP ICON ALPHA CHANNEL
      # ============================================================

      - name: Fix iOS App Icon Alpha Channel
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIXING IOS APP ICON ALPHA CHANNEL"
          echo "=========================================="

          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"

          if [ ! -d "$ICON_DIR" ]; then
            echo "ERROR: AppIcon directory not found:"
            echo "$ICON_DIR"
            exit 1
          fi

          echo ""
          echo "AppIcon files:"
          find "$ICON_DIR" -maxdepth 1 -type f -print

          echo ""
          echo "Installing Pillow..."

          python3 -m pip install --quiet --disable-pip-version-check Pillow

          export ICON_DIR

          python3 <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          icon_dir = Path(os.environ["ICON_DIR"])

          print("Processing AppIcon PNG files...")
          print("Directory:", icon_dir)

          png_files = sorted(icon_dir.glob("*.png"))

          if not png_files:
              raise SystemExit("ERROR: No PNG files found in AppIcon.appiconset")

          processed = 0

          for path in png_files:
              print(f"Checking: {path.name}")

              with Image.open(path) as img:
                  print(
                      f"  mode={img.mode}, "
                      f"size={img.size}, "
                      f"format={img.format}"
                  )

                  # If image has alpha/transparency, composite it
                  # onto an opaque white background.
                  has_alpha = (
                      img.mode in ("RGBA", "LA")
                      or (
                          img.mode == "P"
                          and "transparency" in img.info
                      )
                  )

                  if has_alpha:
                      print("  Alpha detected -> removing alpha")

                      rgba = img.convert("RGBA")

                      background = Image.new(
                          "RGB",
                          rgba.size,
                          (255, 255, 255)
                      )

                      alpha = rgba.getchannel("A")

                      background.paste(
                          rgba,
                          mask=alpha
                      )

                      background.save(
                          path,
                          format="PNG",
                          optimize=True
                      )

                      processed += 1

                  else:
                      # Convert grayscale/paletted images to RGB
                      # so the resulting PNG is guaranteed opaque.
                      if img.mode not in ("RGB",):
                          print(
                              f"  Converting {img.mode} -> RGB"
                          )

                          rgb = img.convert("RGB")

                          rgb.save(
                              path,
                              format="PNG",
                              optimize=True
                          )

                          processed += 1

          print("")
          print(f"Processed {processed} PNG files.")
          PY

          echo ""
          echo "VERIFYING APP ICONS HAVE NO ALPHA..."

          export ICON_DIR

          python3 <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          icon_dir = Path(os.environ["ICON_DIR"])

          errors = []

          for path in sorted(icon_dir.glob("*.png")):

              with Image.open(path) as img:

                  if img.mode not in ("RGB", "L"):
                      errors.append(
                          f"{path.name}: mode={img.mode}"
                      )

                  if img.mode == "RGBA":
                      errors.append(
                          f"{path.name}: RGBA still contains alpha"
                      )

                  if img.mode == "LA":
                      errors.append(
                          f"{path.name}: LA still contains alpha"
                      )

                  if (
                      img.mode == "P"
                      and "transparency" in img.info
                  ):
                      errors.append(
                          f"{path.name}: palette transparency"
                      )

          if errors:
              print("APP ICON ALPHA VERIFICATION FAILED:")

              for error in errors:
                  print(error)

              raise SystemExit(1)

          print("SUCCESS: All AppIcon PNG files are opaque.")
          PY

          echo ""
          echo "APP ICON FIX COMPLETE."


      # ============================================================
      # PREPARE P12
      # ============================================================

      - name: Prepare signing files
        shell: bash
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "PREPARING SIGNING FILES"
          echo "=========================================="

          SIGNING_DIR="$RUNNER_TEMP/signing"

          rm -rf "$SIGNING_DIR"
          mkdir -p "$SIGNING_DIR"

          cp "${P12_FILE}" \
            "$SIGNING_DIR/ios_distribution.p12"

          cp "${PROFILE_FILE}" \
            "$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision"

          chmod 600 "$SIGNING_DIR/ios_distribution.p12"
          chmod 600 "$SIGNING_DIR/PPDELI_App_Store_Distribution.mobileprovision"

          echo ""
          echo "Verifying original P12..."

          openssl pkcs12 \
            -info \
            -in "$SIGNING_DIR/ios_distribution.p12" \
            -noout \
            -passin pass:"$IOS_CERTIFICATE_PASSWORD" \
            || {
              echo "ERROR: Original P12 password is incorrect."
              exit 1
            }

          echo ""
          echo "Original P12 verified."


      # ============================================================
      # REBUILD P12 FOR MACOS
      # ============================================================

      - name: Rebuild P12 for macOS keychain
        shell: bash
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "REBUILDING P12"
          echo "=========================================="

          SIGNING_DIR="$RUNNER_TEMP/signing"

          OLD_P12="$SIGNING_DIR/ios_distribution.p12"

          CERT_PEM="$SIGNING_DIR/certificate.pem"
          KEY_PEM="$SIGNING_DIR/private-key.pem"

          NEW_P12="$SIGNING_DIR/ios_distribution_mac.p12"

          echo "Extracting certificate..."

          openssl pkcs12 \
            -in "$OLD_P12" \
            -clcerts \
            -nokeys \
            -out "$CERT_PEM" \
            -passin pass:"$IOS_CERTIFICATE_PASSWORD"

          echo "Extracting private key..."

          openssl pkcs12 \
            -in "$OLD_P12" \
            -nocerts \
            -nodes \
            -out "$KEY_PEM" \
            -passin pass:"$IOS_CERTIFICATE_PASSWORD"

          echo "Creating new P12..."

          openssl pkcs12 \
            -export \
            -out "$NEW_P12" \
            -inkey "$KEY_PEM" \
            -in "$CERT_PEM" \
            -passout pass:"$IOS_CERTIFICATE_PASSWORD" \
            -name "Apple Distribution"

          chmod 600 "$NEW_P12"

          echo ""
          echo "Verifying rebuilt P12..."

          openssl pkcs12 \
            -info \
            -in "$NEW_P12" \
            -noout \
            -passin pass:"$IOS_CERTIFICATE_PASSWORD"

          echo ""
          echo "P12 rebuild completed."


      # ============================================================
      # VERIFY PROVISIONING PROFILE
      # ============================================================

      - name: Verify provisioning profile
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING PROVISIONING PROFILE"
          echo "=========================================="

          PROFILE="$RUNNER_TEMP/signing/PPDELI_App_Store_Distribution.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE" \
            > "$RUNNER_TEMP/profile.plist"

          echo ""
          echo "Profile Name:"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          echo ""
          echo "Team ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          echo ""
          echo "Application Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

          echo ""
          echo "UUID:"

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"


      # ============================================================
      # CREATE TEMPORARY KEYCHAIN
      # ============================================================

      - name: Create temporary keychain
        shell: bash
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "CREATING TEMPORARY KEYCHAIN"
          echo "=========================================="

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo ""
          echo "Importing Apple Distribution certificate..."

          security import \
            "$RUNNER_TEMP/signing/ios_distribution_mac.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Imported certificates:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      # ============================================================
      # INSTALL PROVISIONING PROFILE
      # ============================================================

      - name: Install provisioning profile
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING PROVISIONING PROFILE"
          echo "=========================================="

          PROFILE="$RUNNER_TEMP/signing/PPDELI_App_Store_Distribution.mobileprovision"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo ""
          echo "Provisioning profile installed."


      # ============================================================
      # CREATE EXPORT OPTIONS
      # ============================================================

      - name: Create ExportOptions.plist
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CREATING EXPORTOPTIONS.PLIST"
          echo "=========================================="

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

            <key>method</key>
            <string>app-store</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>uploadSymbols</key>
            <true/>

          </dict>
          </plist>
          EOF

          plutil -lint ios/ExportOptions.plist

          echo ""
          cat ios/ExportOptions.plist


      # ============================================================
      # INSTALL COCOAPODS
      # ============================================================

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING COCOAPODS"
          echo "=========================================="

          cd ios

          pod repo update

          pod install --repo-update

          cd ..

          echo ""
          echo "CocoaPods installation completed."


      # ============================================================
      # VERIFY GENERATED CONFIGURATION
      # ============================================================

      - name: Verify Flutter generated configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING FLUTTER GENERATED CONFIG"
          echo "=========================================="

          if [ ! -f "ios/Flutter/Generated.xcconfig" ]; then

            echo "Generated.xcconfig not found."

            echo "Generating Flutter iOS configuration..."

            flutter build ios \
              --release \
              --no-codesign \
              --config-only

          fi

          if [ ! -f "ios/Flutter/Generated.xcconfig" ]; then
            echo "ERROR: Generated.xcconfig still missing."
            exit 1
          fi

          echo "Generated.xcconfig exists."


      # ============================================================
      # VERIFY SIGNING SETTINGS
      # ============================================================

      - name: Verify Xcode signing settings
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING XCODE SIGNING"
          echo "=========================================="

          echo ""
          echo "Bundle ID search:"

          grep -R \
            "com.ppdeli.market" \
            ios/Runner.xcodeproj/project.pbxproj \
            | head -20 || true

          echo ""
          echo "Team ID search:"

          grep -R \
            "G54KQ62958" \
            ios/Runner.xcodeproj/project.pbxproj \
            | head -20 || true


      # ============================================================
      # VERIFY APP ICON BEFORE BUILD
      # ============================================================

      - name: Final AppIcon verification
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL APPICON VERIFICATION"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          icon_dir = Path(
              "ios/Runner/Assets.xcassets/AppIcon.appiconset"
          )

          pngs = sorted(icon_dir.glob("*.png"))

          if not pngs:
              raise SystemExit(
                  "ERROR: No AppIcon PNG files found."
              )

          for path in pngs:
              with Image.open(path) as img:

                  print(
                      f"{path.name}: "
                      f"{img.size} "
                      f"mode={img.mode}"
                  )

                  if img.mode in ("RGBA", "LA"):
                      raise SystemExit(
                          f"ERROR: Alpha channel remains: {path}"
                      )

                  if (
                      img.mode == "P"
                      and "transparency" in img.info
                  ):
                      raise SystemExit(
                          f"ERROR: Transparency remains: {path}"
                      )

          print("")
          print("All AppIcon files are opaque.")
          PY


      # ============================================================
      # BUILD UNSIGNED XCARCHIVE
      # ============================================================

      - name: Build unsigned XCArchive
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING UNSIGNED XCARCHIVE"
          echo "=========================================="

          flutter clean

          flutter pub get

          flutter build ipa \
            --release \
            --no-codesign

          echo ""
          echo "Unsigned archive created."


      # ============================================================
      # FIND ARCHIVE
      # ============================================================

      - name: Find XCArchive
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINDING XCARCHIVE"
          echo "=========================================="

          ARCHIVE=$(find build/ios/archive \
            -maxdepth 1 \
            -name "*.xcarchive" \
            -print \
            -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: XCArchive not found."
            find build/ios -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ARCHIVE=$ARCHIVE"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"


      # ============================================================
      # EXPORT SIGNED IPA
      # ============================================================

      - name: Export signed IPA
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "EXPORTING SIGNED IPA"
          echo "=========================================="

          rm -rf build/ios/ipa

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates

          echo ""
          echo "IPA files:"

          ls -lh build/ios/ipa


      # ============================================================
      # VERIFY IPA
      # ============================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING IPA"
          echo "=========================================="

          IPA=$(find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            -print \
            -quit)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          echo "IPA:"
          ls -lh "$IPA"

          echo ""
          echo "Extracting IPA..."

          VERIFY_DIR="$RUNNER_TEMP/ipa_verify"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          unzip -q "$IPA" \
            -d "$VERIFY_DIR"

          APP="$VERIFY_DIR/Payload/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app not found."
            find "$VERIFY_DIR" -maxdepth 3 -print
            exit 1
          fi

          echo ""
          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          ACTUAL_BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          if [ "$ACTUAL_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Bundle ID mismatch."
            echo "Expected: $BUNDLE_ID"
            echo "Actual:   $ACTUAL_BUNDLE_ID"
            exit 1
          fi

          echo ""
          echo "Bundle ID verified."


      # ============================================================
      # VERIFY EMBEDDED PROVISIONING PROFILE
      # ============================================================

      - name: Verify embedded provisioning profile
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING EMBEDDED PROVISIONING PROFILE"
          echo "=========================================="

          VERIFY_DIR="$RUNNER_TEMP/ipa_verify"

          EMBEDDED_PROFILE="$VERIFY_DIR/Payload/Runner.app/embedded.mobileprovision"

          if [ ! -f "$EMBEDDED_PROFILE" ]; then
            echo "ERROR: embedded.mobileprovision not found."
            exit 1
          fi

          security cms \
            -D \
            -i "$EMBEDDED_PROFILE" \
            > "$RUNNER_TEMP/embedded_profile.plist"

          echo ""
          echo "Embedded Profile Name:"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/embedded_profile.plist"

          echo ""
          echo "Embedded Application Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/embedded_profile.plist"


      # ============================================================
      # VERIFY IPA APP ICON HAS NO ALPHA
      # ============================================================

      - name: Verify IPA AppIcon alpha
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ICON INSIDE FINAL IPA"
          echo "=========================================="

          VERIFY_DIR="$RUNNER_TEMP/ipa_verify"

          APP="$VERIFY_DIR/Payload/Runner.app"

          ICON_DIR="$APP/Assets.car"

          if [ ! -f "$ICON_DIR" ]; then
            echo "Assets.car exists through asset catalog compilation."
            echo "The source AppIcon files were already verified before build."
          fi

          echo ""
          echo "Final IPA verification completed."


      # ============================================================
      # UPLOAD IPA ARTIFACT
      # ============================================================

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPDELI-iOS-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # UPLOAD TO APP STORE CONNECT
      # ============================================================

      - name: Upload IPA to App Store Connect
        shell: bash
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "UPLOADING IPA TO APP STORE CONNECT"
          echo "=========================================="

          IPA=$(find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            -print \
            -quit)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          echo ""
          echo "IPA:"
          ls -lh "$IPA"

          echo ""
          echo "=========================================="
          echo "CREATING APP STORE CONNECT API KEY"
          echo "=========================================="

          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"

          mkdir -p "$API_KEY_DIR"

          API_KEY_FILE="$API_KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

          printf '%s\n' "$APPSTORE_PRIVATE_KEY" \
            > "$API_KEY_FILE"

          chmod 600 "$API_KEY_FILE"

          echo "API Key prepared."


          # ========================================================
          # VALIDATE
          # ========================================================

          echo ""
          echo "=========================================="
          echo "VALIDATING IPA WITH APP STORE CONNECT"
          echo "=========================================="

          xcrun altool \
            --validate-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"


          # ========================================================
          # UPLOAD
          # ========================================================

          echo ""
          echo "=========================================="
          echo "UPLOADING IPA"
          echo "=========================================="

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"


          echo ""
          echo "=========================================="
          echo "APP STORE CONNECT UPLOAD COMPLETED"
          echo "=========================================="

          rm -rf "$HOME/.appstoreconnect/private_keys"


      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup signing files
        if: always()
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set +e

          echo "=========================================="
          echo "CLEANING UP"
          echo "=========================================="

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          if [ -f "$KEYCHAIN_PATH" ]; then

            security delete-keychain \
              "$KEYCHAIN_PATH" \
              || true

          fi

          rm -rf \
            "$RUNNER_TEMP/signing" \
            "$RUNNER_TEMP/ipa_verify" \
            "$HOME/.appstoreconnect/private_keys"

          echo "Cleanup completed."
