name: Build Flutter AAB

on:
  push:
    branches:
      - "23-6-2026"
  pull_request:
    branches:
      - "23-6-2026"
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # ضبط ذاكرة Gradle لتجنب OOM
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.vfs.watch=false
        -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
        -Dkotlin.incremental=true
      JAVA_TOOL_OPTIONS: "-Xmx4g -Dfile.encoding=UTF-8"
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-caches: |
            caches
            notifications
            wrapper
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - name: Configure Gradle Memory Settings
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8/' android/gradle.properties
            grep -q "^org.gradle.jvmargs" android/gradle.properties || \
              echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
            grep -q "^android.useAndroidX" android/gradle.properties || \
              echo "android.useAndroidX=true" >> android/gradle.properties
            grep -q "^org.gradle.workers.max" android/gradle.properties || \
              echo "org.gradle.workers.max=2" >> android/gradle.properties
          else
            mkdir -p android
            cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.workers.max=2
          android.useAndroidX=true
          EOF
          fi
          echo "=== gradle.properties ==="
          cat android/gradle.properties
      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      # بناء Android App Bundle
      - name: Build Flutter App Bundle
        run: |
          flutter build appbundle \
            --release \
            --no-tree-shake-icons \
            --verbose
      # عرض ملف AAB الناتج
      - name: List Built AAB
        if: always()
        run: |
          echo "=== Built AAB files ==="
          find build/app/outputs/bundle -name "*.aab" -exec ls -lh {} \; || true
      # رفع AAB كـ Artifact
      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

      # حفظ ملفات التشخيص إذا فشل البناء
      - name: Upload Build Outputs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/**/*.log
            android/**/*.txt
            **/*.stacktrace
            build/app/outputs/logs/
            /tmp/hs_err_pid*.log
            /tmp/java_pid*.hprof
          if-no-files-found: ignore
          retention-days: 7
