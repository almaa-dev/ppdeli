name: Build iOS Release IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Signed iOS IPA
    runs-on: macos-14

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true


      # =========================================================
      # 3. Flutter Doctor
      # =========================================================
      - name: Flutter Doctor
        run: flutter doctor -v


      # =========================================================
      # 4. Flutter Pub Get
      # =========================================================
      - name: Flutter Pub Get
        run: flutter pub get


      # =========================================================
      # 5. Install CocoaPods
      # =========================================================
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update


      # =========================================================
      # 6. Create temporary Keychain
      # =========================================================
      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            build.keychain

          security set-keychain-settings \
            -lut 21600 \
            build.keychain

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            build.keychain

          security list-keychains \
            -d user \
            -s build.keychain login.keychain-db

          security default-keychain \
            -s build.keychain


      # =========================================================
      # 7. Install Apple Distribution Certificate
      # =========================================================
      - name: Install Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security import certificate.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          echo "Available signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            build.keychain


      # =========================================================
      # 8. Install Provisioning Profile
      # =========================================================
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"

          echo "Provisioning profile installed."


      # =========================================================
      # 9. Read Provisioning Profile information
      # =========================================================
      - name: Read Provisioning Profile
        run: |
          set -e

          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"

          security cms -D \
            -i "$PROFILE_PATH" \
            > /tmp/profile.plist

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            /tmp/profile.plist
          )

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            /tmp/profile.plist
          )

          TEAM_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            /tmp/profile.plist
          )

          APP_IDENTIFIER=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            /tmp/profile.plist
          )

          BUNDLE_IDENTIFIER=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            /tmp/profile.plist |
            sed "s/^$TEAM_ID\.//"
          )

          echo "=========================================="
          echo "Provisioning Profile Information"
          echo "=========================================="
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID:      $TEAM_ID"
          echo "App ID:       $APP_IDENTIFIER"
          echo "Bundle ID:    $BUNDLE_IDENTIFIER"
          echo "=========================================="

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_IDENTIFIER=$BUNDLE_IDENTIFIER" >> "$GITHUB_ENV"


      # =========================================================
      # 10. Verify expected Bundle ID
      # =========================================================
      - name: Verify Bundle ID
        run: |
          set -e

          EXPECTED_BUNDLE_ID="com.ppdeli.market"

          if [ "$BUNDLE_IDENTIFIER" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "ERROR: Bundle ID mismatch!"
            echo "Expected: $EXPECTED_BUNDLE_ID"
            echo "Profile:  $BUNDLE_IDENTIFIER"
            exit 1
          fi

          echo "Bundle ID verified: $BUNDLE_IDENTIFIER"


      # =========================================================
      # 11. Configure Xcode Manual Distribution Signing
      # =========================================================
      - name: Configure Manual Distribution Signing
        run: |
          set -e

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          echo "Configuring:"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_IDENTIFIER"
          echo "Profile: $PROFILE_NAME"

          python3 <<'PY'
          import os
          from pathlib import Path

          project = Path("ios/Runner.xcodeproj/project.pbxproj")

          text = project.read_text()

          team_id = os.environ["TEAM_ID"]
          profile_name = os.environ["PROFILE_NAME"]

          # -----------------------------------------------------
          # Automatic -> Manual
          # -----------------------------------------------------
          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;"
          )

          # -----------------------------------------------------
          # Development -> Distribution
          # -----------------------------------------------------
          text = text.replace(
              'CODE_SIGN_IDENTITY = "Apple Development";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";'
          )

          text = text.replace(
              'CODE_SIGN_IDENTITY = "iPhone Developer";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";'
          )

          # -----------------------------------------------------
          # Replace existing Team ID
          # -----------------------------------------------------
          import re

          text = re.sub(
              r'DEVELOPMENT_TEAM = [^;]+;',
              f'DEVELOPMENT_TEAM = {team_id};',
              text
          )

          # -----------------------------------------------------
          # Replace existing provisioning profile
          # -----------------------------------------------------
          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = [^;]+;',
              f'PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";',
              text
          )

          # -----------------------------------------------------
          # Add missing signing settings
          # -----------------------------------------------------
          lines = text.splitlines()

          output = []

          for line in lines:

              output.append(line)

              if "CODE_SIGN_STYLE = Manual;" in line:

                  indent = line[
                      :len(line) - len(line.lstrip())
                  ]

                  # Add identity only if not already present
                  output.append(
                      indent +
                      'CODE_SIGN_IDENTITY = "Apple Distribution";'
                  )

                  # Add Team ID
                  output.append(
                      indent +
                      f'DEVELOPMENT_TEAM = {team_id};'
                  )

                  # Add provisioning profile
                  output.append(
                      indent +
                      f'PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";'
                  )

          project.write_text(
              "\n".join(output) + "\n"
          )

          print("Xcode signing configuration updated.")
          PY

          echo "=========================================="
          echo "Xcode signing configuration completed"
          echo "=========================================="


      # =========================================================
      # 12. Show signing configuration
      # =========================================================
      - name: Verify Xcode Signing Configuration
        run: |
          echo "Manual signing configuration:"
          grep -n \
            -E \
            "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj \
            | head -100


      # =========================================================
      # 13. Create ExportOptions.plist
      # =========================================================
      - name: Create ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.ppdeli.market</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created."

          cat ios/ExportOptions.plist


      # =========================================================
      # 14. Clean Flutter
      # =========================================================
      - name: Flutter Clean
        run: flutter clean


      # =========================================================
      # 15. Flutter Pub Get again
      # =========================================================
      - name: Flutter Pub Get Again
        run: flutter pub get


      # =========================================================
      # 16. Install Pods again
      # =========================================================
      - name: Install Pods Again
        run: |
          cd ios
          pod install


      # =========================================================
      # 17. Build signed IPA
      # =========================================================
      - name: Build Signed IPA
        run: |
          set -e

          echo "=========================================="
          echo "Building iOS Release IPA"
          echo "=========================================="

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

          echo "=========================================="
          echo "IPA build completed"
          echo "=========================================="


      # =========================================================
      # 18. Show generated files
      # =========================================================
      - name: Show IPA Files
        run: |
          echo "IPA files:"
          find build/ios/ipa \
            -type f \
            -name "*.ipa" \
            -print

          echo ""
          echo "Archive files:"
          find build/ios/archive \
            -maxdepth 2 \
            -type d \
            -name "*.xcarchive" \
            -print


      # =========================================================
      # 19. Upload IPA Artifact
      # =========================================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7


      # =========================================================
      # 20. Upload XCArchive Artifact
      # =========================================================
      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-xcarchive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: warn
          retention-days: 7


      # =========================================================
      # 21. Cleanup
      # =========================================================
      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f certificate.p12
          rm -f /tmp/profile.plist

          rm -f \
            "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision" \
            || true

          security delete-keychain build.keychain \
            || true
