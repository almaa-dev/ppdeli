name: Build iOS IPA Release

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build-ios:
name: Build iOS Release IPA
runs-on: macos-14

steps:
  # 1. تحميل المشروع
  - name: Checkout
    uses: actions/checkout@v4

  # 2. إعداد Flutter
  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: '3.44.8'
      channel: stable
      cache: true

  # 3. التحقق من Flutter
  - name: Flutter Doctor
    run: flutter doctor -v

  # 4. تثبيت Dependencies
  - name: Flutter Pub Get
    run: flutter pub get

  # 5. تثبيت CocoaPods
  - name: Install CocoaPods
    run: |
      cd ios
      pod install --repo-update

  # 6. إنشاء Keychain خاص بالـ CI
  - name: Create temporary keychain
    env:
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    run: |
      security create-keychain \
        -p "$KEYCHAIN_PASSWORD" \
        build.keychain

      security set-keychain-settings \
        -lut 21600 \
        build.keychain

      security unlock-keychain \
        -p "$KEYCHAIN_PASSWORD" \
        build.keychain

      security list-keychains \
        -d user \
        -s build.keychain login.keychain-db

  # 7. فك شهادة Apple Distribution
  - name: Install Apple Distribution Certificate
    env:
      CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    run: |
      echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12

      security import certificate.p12 \
        -k build.keychain \
        -P "$CERTIFICATE_PASSWORD" \
        -T /usr/bin/codesign \
        -T /usr/bin/security

      security set-key-partition-list \
        -S apple-tool:,apple: \
        -s \
        -k "$KEYCHAIN_PASSWORD" \
        build.keychain

  # 8. تثبيت Provisioning Profile
  - name: Install Provisioning Profile
    env:
      PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    run: |
      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

      echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
        > "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"

  # 9. التحقق من الشهادة
  - name: Check Signing Identity
    run: |
      security find-identity \
        -v \
        -p codesigning \
        build.keychain

  # 10. بناء IPA
  - name: Build IPA
    run: |
      flutter build ipa \
        --release \
        --export-options-plist=ios/ExportOptions.plist

  # 11. رفع IPA كـ Artifact
  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: ios-release-ipa
      path: build/ios/ipa/*.ipa
      if-no-files-found: error

  # 12. رفع Archive أيضًا
  - name: Upload XCArchive
    uses: actions/upload-artifact@v4
    with:
      name: ios-release-archive
      path: build/ios/archive/*.xcarchive
      if-no-files-found: warn

  # 13. تنظيف الملفات الحساسة
  - name: Cleanup
    if: always()
    run: |
      rm -f certificate.p12
      rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"

      security delete-keychain build.keychain || true
