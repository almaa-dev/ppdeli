name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Signed iOS IPA
    runs-on: macos-14

    env:
      APPLE_TEAM_ID: G54KQ62958
      BUNDLE_ID: com.ppdeli.market
      PROFILE_NAME: ppdeli2

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      # =========================================================
      # 3. Flutter version
      # =========================================================
      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      # =========================================================
      # 4. Check Apple signing files
      # =========================================================
      - name: Check Apple signing files
        run: |
          set -e

          echo "Checking Apple signing files..."

          test -f ios/signing/ios_distribution.p12
          test -f ios/signing/ppdeli2.mobileprovision

          echo "P12 found:"
          ls -lh ios/signing/ios_distribution.p12

          echo "Provisioning profile found:"
          ls -lh ios/signing/ppdeli2.mobileprovision

          echo "Apple signing files are available."

      # =========================================================
      # 5. Flutter dependencies
      # =========================================================
      - name: Flutter pub get
        run: |
          set -e
          flutter pub get

      # =========================================================
      # 6. Install CocoaPods
      # =========================================================
      - name: Install CocoaPods
        run: |
          set -e

          sudo gem install cocoapods

          pod --version

      # =========================================================
      # 7. Install Pods
      # =========================================================
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -e

          pod deintegrate || true
          pod install --repo-update

      # =========================================================
      # 8. Create temporary keychain
      # =========================================================
      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Creating temporary keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Temporary keychain created successfully."

      # =========================================================
      # 9. Import Apple Distribution certificate
      # =========================================================
      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "Unlocking keychain..."

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Importing Apple Distribution certificate..."

          security import \
            "ios/signing/ios_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo "Certificate imported successfully."

          echo ""
          echo "Available code signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # =========================================================
      # 10. Set key partition list
      # =========================================================
      - name: Configure keychain access
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Keychain access configured."

      # =========================================================
      # 11. Read provisioning profile
      # =========================================================
      - name: Read provisioning profile
        run: |
          set -e

          PROFILE_PATH="ios/signing/ppdeli2.mobileprovision"

          echo "Reading provisioning profile..."

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME_FROM_FILE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo ""
          echo "Provisioning Profile:"
          echo "Name: $PROFILE_NAME_FROM_FILE"
          echo "UUID: $PROFILE_UUID"
          echo "Team ID: $PROFILE_TEAM_ID"
          echo "Application ID: $PROFILE_APP_ID"

          echo ""

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "ERROR: Provisioning profile Team ID does not match."
            echo "Expected: $APPLE_TEAM_ID"
            echo "Found:    $PROFILE_TEAM_ID"
            exit 1
          fi

          case "$PROFILE_APP_ID" in
            "$APPLE_TEAM_ID.$BUNDLE_ID")
              echo "Bundle ID matches provisioning profile."
              ;;
            *)
              echo "ERROR: Bundle ID does not match provisioning profile."
              echo "Expected: $APPLE_TEAM_ID.$BUNDLE_ID"
              echo "Found:    $PROFILE_APP_ID"
              exit 1
              ;;
          esac

      # =========================================================
      # 12. Install provisioning profile
      # =========================================================
      - name: Install provisioning profile
        run: |
          set -e

          PROFILE_SOURCE="ios/signing/ppdeli2.mobileprovision"

          PROFILE_DEST="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DEST"

          cp \
            "$PROFILE_SOURCE" \
            "$PROFILE_DEST/$PROFILE_UUID.mobileprovision"

          echo "Provisioning profile installed:"
          echo "$PROFILE_DEST/$PROFILE_UUID.mobileprovision"

          ls -lh "$PROFILE_DEST"

      # =========================================================
      # 13. Configure Flutter iOS project
      # =========================================================
      - name: Configure iOS project
        run: |
          set -e

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          echo "Configuring Xcode project..."

          # -----------------------------------------------------
          # Team ID
          # -----------------------------------------------------
          sed -i '' \
            "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" \
            "$PROJECT_FILE"

          # -----------------------------------------------------
          # Bundle ID
          # -----------------------------------------------------
          sed -i '' \
            "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" \
            "$PROJECT_FILE"

          # -----------------------------------------------------
          # Automatic signing -> Manual
          # -----------------------------------------------------
          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT_FILE"

          # -----------------------------------------------------
          # Development identity -> Distribution
          # -----------------------------------------------------
          sed -i '' \
            's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          echo "Basic signing configuration completed."

      # =========================================================
      # 14. Configure manual provisioning
      # =========================================================
      - name: Configure manual provisioning
        run: |
          set -e

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          echo "Configuring provisioning profile..."

          # Remove old provisioning profile settings
          sed -i '' \
            '/PROVISIONING_PROFILE_SPECIFIER = /d' \
            "$PROJECT_FILE" || true

          sed -i '' \
            '/PROVISIONING_PROFILE = /d' \
            "$PROJECT_FILE" || true

          python3 - <<PY
          from pathlib import Path

          path = Path("$PROJECT_FILE")
          text = path.read_text()

          # Add provisioning profile after Apple Distribution identity.
          old = 'CODE_SIGN_IDENTITY = "Apple Distribution";'

          new = (
              'CODE_SIGN_IDENTITY = "Apple Distribution";\n'
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$PROFILE_NAME";'
          )

          text = text.replace(old, new)

          path.write_text(text)
          PY

          echo "Manual provisioning configured."

          echo ""
          echo "Current signing settings:"

          grep -E \
            "DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            "$PROJECT_FILE" \
            || true

      # =========================================================
      # 15. Flutter clean
      # =========================================================
      - name: Flutter clean
        run: |
          set -e

          flutter clean
          flutter pub get

      # =========================================================
      # 16. Reinstall Pods
      # =========================================================
      - name: Reinstall Pods
        working-directory: ios
        run: |
          set -e

          pod install

      # =========================================================
      # 17. Generate Flutter iOS files
      # =========================================================
      - name: Generate Flutter iOS files
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign

      # =========================================================
      # 18. Verify signing configuration
      # =========================================================
      - name: Verify signing configuration
        run: |
          set -e

          echo "Checking signing identities..."

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Checking provisioning profiles..."

          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo ""
          echo "Checking Xcode project settings..."

          grep -E \
            "DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj \
            || true

      # =========================================================
      # 19. Create ExportOptions.plist if missing
      # =========================================================
      - name: Create ExportOptions.plist
        run: |
          set -e

          if [ -f ios/ExportOptions.plist ]; then
            echo "Using existing ios/ExportOptions.plist"
            cat ios/ExportOptions.plist
          else
            echo "Creating ios/ExportOptions.plist"

            cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

            echo "ExportOptions.plist created."
            cat ios/ExportOptions.plist
          fi

      # =========================================================
      # 20. Build signed IPA
      # =========================================================
      - name: Build signed IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "Unlocking signing keychain..."

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Signing identities before build:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Building signed IPA..."

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      # =========================================================
      # 21. Verify IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -e

          echo "Checking generated IPA..."

          test -d build/ios/ipa

          find build/ios/ipa \
            -type f \
            -name "*.ipa" \
            -print

          IPA_COUNT=$(find build/ios/ipa -type f -name "*.ipa" | wc -l | tr -d ' ')

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi

          echo ""
          echo "IPA generated successfully."

          ls -lh build/ios/ipa/

      # =========================================================
      # 22. Upload IPA artifact
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      # =========================================================
      # 23. Upload dSYM
      # =========================================================
      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-dsym
          path: build/ios/archive/Runner.xcarchive/dSYMs/**
          if-no-files-found: warn
          retention-days: 7

      # =========================================================
      # 24. Cleanup
      # =========================================================
      - name: Cleanup signing keychain
        if: always()
        run: |
          echo "Cleaning temporary signing keychain..."

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          rm -f \
            "$RUNNER_TEMP/profile.plist" \
            || true

          echo "Cleanup completed."
