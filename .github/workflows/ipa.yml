name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Signed iOS Release IPA
    runs-on: macos-14
    timeout-minutes: 60

    env:
      APPLE_TEAM_ID: G54KQ62958
      BUNDLE_ID: com.ppdeli.market
      PROFILE_NAME: ppdeli2

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Setup Flutter
      # ---------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true


      # ---------------------------------------------------------
      # 3. Flutter information
      # ---------------------------------------------------------
      - name: Flutter information
        run: |
          flutter --version
          flutter doctor -v


      # ---------------------------------------------------------
      # 4. Disable Swift Package Manager
      # ---------------------------------------------------------
      - name: Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager


      # ---------------------------------------------------------
      # 5. Flutter dependencies
      # ---------------------------------------------------------
      - name: Flutter pub get
        run: |
          flutter pub get


      # ---------------------------------------------------------
      # 6. CocoaPods
      # ---------------------------------------------------------
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod repo update
          pod install --repo-update
          cd ..


      # ---------------------------------------------------------
      # 7. Create temporary keychain
      # ---------------------------------------------------------
      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "Creating temporary keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security default-keychain -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 8. Decode P12
      # ---------------------------------------------------------
      - name: Decode Apple certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          set -e

          echo "Decoding Apple certificate..."

          printf '%s' "$IOS_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/ios_distribution.p12"

          echo "Decoded P12:"
          ls -lh "$RUNNER_TEMP/ios_distribution.p12"


      # ---------------------------------------------------------
      # 9. Verify P12 BEFORE security import
      # ---------------------------------------------------------
      - name: Verify decoded P12
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          echo "Testing decoded P12 with OpenSSL..."

          printf '%s' "$IOS_CERTIFICATE_PASSWORD" \
            | openssl pkcs12 \
              -in "$RUNNER_TEMP/ios_distribution.p12" \
              -passin stdin \
              -noout

          echo "P12 verification successful."


      # ---------------------------------------------------------
      # 10. Import P12 into temporary keychain
      # ---------------------------------------------------------
      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          echo "Importing Apple Distribution certificate..."

          security import "$RUNNER_TEMP/ios_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo "Certificate imported successfully."


      # ---------------------------------------------------------
      # 11. Allow codesign access to private key
      # ---------------------------------------------------------
      - name: Configure keychain access
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Keychain access configured."


      # ---------------------------------------------------------
      # 12. Verify Apple Distribution identity
      # ---------------------------------------------------------
      - name: Verify signing identity
        run: |
          set -e

          echo "Available signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "Checking Apple Distribution identity..."

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH" \
            | grep "Apple Distribution"

          echo "Apple Distribution identity found."


      # ---------------------------------------------------------
      # 13. Decode provisioning profile
      # ---------------------------------------------------------
      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e

          echo "Decoding provisioning profile..."

          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/ppdeli2.mobileprovision"

          echo "Installing provisioning profile..."

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              /dev/stdin \
              < <(
                security cms -D \
                -i "$RUNNER_TEMP/ppdeli2.mobileprovision"
              )
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              /dev/stdin \
              < <(
                security cms -D \
                -i "$RUNNER_TEMP/ppdeli2.mobileprovision"
              )
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp \
            "$RUNNER_TEMP/ppdeli2.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Profile installed."
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"


      # ---------------------------------------------------------
      # 14. Verify provisioning profile
      # ---------------------------------------------------------
      - name: Verify provisioning profile
        run: |
          set -e

          security cms -D \
            -i "$RUNNER_TEMP/ppdeli2.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          echo "Provisioning profile information:"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          echo "Application Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

          echo "get-task-allow:"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:get-task-allow" \
            "$RUNNER_TEMP/profile.plist"

          echo "Checking Team ID..."

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist" \
            | grep -Fx "$APPLE_TEAM_ID"

          echo "Checking Bundle ID..."

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist" \
            | grep -Fx "${APPLE_TEAM_ID}.${BUNDLE_ID}"

          echo "Provisioning profile verification successful."


      # ---------------------------------------------------------
      # 15. Configure Xcode project signing
      # ---------------------------------------------------------
      - name: Configure manual code signing
        run: |
          set -e

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          echo "Configuring manual signing..."

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          bundle_id = "com.ppdeli.market"
          team_id = "G54KQ62958"

          blocks = text.split("\n")

          inside_target_config = False
          brace_depth = 0
          output = []

          for line in blocks:

              if "buildSettings = {" in line:
                  inside_target_config = True
                  brace_depth = 1

              elif inside_target_config:
                  brace_depth += line.count("{")
                  brace_depth -= line.count("}")

              if inside_target_config:

                  if f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};" in line:

                      indent = line[:len(line) - len(line.lstrip())]

                      output.append(
                          indent + "CODE_SIGN_STYLE = Manual;"
                      )

                      output.append(
                          indent + f"DEVELOPMENT_TEAM = {team_id};"
                      )

                      output.append(
                          indent + "CODE_SIGN_IDENTITY = \"Apple Distribution\";"
                      )

                      output.append(
                          indent + "PROVISIONING_PROFILE_SPECIFIER = \"ppdeli2\";"
                      )

              output.append(line)

              if inside_target_config and brace_depth <= 0:
                  inside_target_config = False
                  brace_depth = 0

          path.write_text("\n".join(output))

          print("Xcode signing configuration updated.")
          PY

          echo "Checking signing configuration..."

          grep -n \
            -E \
            "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|PRODUCT_BUNDLE_IDENTIFIER" \
            "$PROJECT_FILE" \
            | head -80


      # ---------------------------------------------------------
      # 16. Create ExportOptions.plist
      # ---------------------------------------------------------
      - name: Create ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>G54KQ62958</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.ppdeli.market</key>
                  <string>ppdeli2</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created."

          cat ios/ExportOptions.plist


      # ---------------------------------------------------------
      # 17. Clean Flutter
      # ---------------------------------------------------------
      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get


      # ---------------------------------------------------------
      # 18. Reinstall Pods after clean
      # ---------------------------------------------------------
      - name: Reinstall Pods
        run: |
          cd ios
          pod install --repo-update
          cd ..


      # ---------------------------------------------------------
      # 19. Build signed IPA
      # ---------------------------------------------------------
      - name: Build signed IPA
        run: |
          set -e

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist


      # ---------------------------------------------------------
      # 20. Show generated IPA
      # ---------------------------------------------------------
      - name: Find IPA
        run: |
          echo "Generated IPA files:"

          find build/ios -type f \
            \( -name "*.ipa" -o -name "*.dSYM.zip" \) \
            -print


      # ---------------------------------------------------------
      # 21. Upload IPA
      # ---------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-ipa
          path: |
            build/ios/ipa/*.ipa
          if-no-files-found: error


      # ---------------------------------------------------------
      # 22. Upload dSYM
      # ---------------------------------------------------------
      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-dsym
          path: |
            build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
            build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM.zip
          if-no-files-found: warn


      # ---------------------------------------------------------
      # 23. Cleanup
      # ---------------------------------------------------------
      - name: Cleanup signing files
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set +e

          echo "Cleaning temporary signing files..."

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          rm -f \
            "$RUNNER_TEMP/ios_distribution.p12" \
            "$RUNNER_TEMP/ppdeli2.mobileprovision" \
            "$RUNNER_TEMP/profile.plist"

          echo "Cleanup completed."
