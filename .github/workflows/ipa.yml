name: Build iOS Release IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Release
    runs-on: macos-14

    env:
      FLUTTER_VERSION: "3.44.8"
      BUNDLE_ID: "com.ppdeli.market"
      TEAM_ID: "G54KQ62958"

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # =========================================================
      # 3. Flutter information
      # =========================================================
      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v


      # =========================================================
      # 4. DISABLE SWIFT PACKAGE MANAGER
      #
      # Flutter 3.44+ uses Swift Package Manager by default.
      # We disable it and use CocoaPods instead.
      # =========================================================
      - name: Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager

          echo "Flutter configuration:"
          flutter config --list


      # =========================================================
      # 5. Install CocoaPods dependencies
      # =========================================================
      - name: Install CocoaPods
        working-directory: ios
        run: |
          echo "Removing old CocoaPods data..."

          rm -rf Pods
          rm -f Podfile.lock

          echo "Installing CocoaPods dependencies..."

          pod install --repo-update


      # =========================================================
      # 6. Decode Apple Distribution certificate
      # =========================================================
      - name: Install Apple Distribution Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "Creating temporary keychain..."

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Decoding certificate..."

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/ios_distribution.p12"

          echo "Importing certificate..."

          security import \
            "$RUNNER_TEMP/ios_distribution.p12" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


      # =========================================================
      # 7. Install Provisioning Profile
      # =========================================================
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "Decoding provisioning profile..."

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"

          echo "Reading provisioning profile..."

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"
          )

          echo "----------------------------------------"
          echo "Provisioning Profile:"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team ID: $PROFILE_TEAM_ID"
          echo "Application ID: $PROFILE_APP_ID"
          echo "----------------------------------------"

          if [ "$PROFILE_TEAM_ID" != "${TEAM_ID}" ]; then
            echo "ERROR: Provisioning Profile Team ID does not match."
            echo "Expected: ${TEAM_ID}"
            echo "Found: $PROFILE_TEAM_ID"
            exit 1
          fi

          if [[ "$PROFILE_APP_ID" != *"${BUNDLE_ID}" ]]; then
            echo "ERROR: Provisioning Profile does not match Bundle ID."
            echo "Expected: ${BUNDLE_ID}"
            echo "Found: $PROFILE_APP_ID"
            exit 1
          fi

          cp \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "Provisioning profile installed successfully."


      # =========================================================
      # 8. Configure Xcode for MANUAL SIGNING
      #
      # This fixes:
      #
      # Runner has conflicting provisioning settings.
      # Runner is automatically signed for development,
      # but Apple Distribution was manually specified.
      # =========================================================
      - name: Configure Xcode Manual Signing
        env:
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
          TEAM_ID: ${{ env.TEAM_ID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          set -e

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          echo "Configuring Xcode project:"
          echo "$PROJECT_FILE"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project file not found."
            exit 1
          fi

          python3 <<'PY'
          import os
          import re

          path = "ios/Runner.xcodeproj/project.pbxproj"

          team_id = os.environ["TEAM_ID"]
          bundle_id = os.environ["BUNDLE_ID"]
          profile_name = os.environ["PROFILE_NAME"]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          lines = content.splitlines()

          new_lines = []

          inside_build_settings = False
          brace_level = 0
          block_lines = []

          def process_build_settings(block):
              result = []

              # Remove existing signing settings so we do not
              # create duplicate/conflicting settings.
              signing_keys = {
                  "CODE_SIGN_STYLE",
                  "CODE_SIGN_IDENTITY",
                  "DEVELOPMENT_TEAM",
                  "PROVISIONING_PROFILE_SPECIFIER",
                  "PRODUCT_BUNDLE_IDENTIFIER",
              }

              for line in block:
                  stripped = line.strip()

                  remove = False

                  for key in signing_keys:
                      if stripped.startswith(key + " ="):
                          remove = True
                          break

                  if not remove:
                      result.append(line)

              # Add our required signing configuration.
              indent = " " * 12

              result.append(
                  f'{indent}CODE_SIGN_STYLE = Manual;'
              )

              result.append(
                  f'{indent}CODE_SIGN_IDENTITY = "Apple Distribution";'
              )

              result.append(
                  f'{indent}DEVELOPMENT_TEAM = {team_id};'
              )

              result.append(
                  f'{indent}PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";'
              )

              result.append(
                  f'{indent}PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};'
              )

              return result

          i = 0

          while i < len(lines):
              line = lines[i]

              if not inside_build_settings:
                  new_lines.append(line)

                  if "buildSettings = {" in line:
                      inside_build_settings = True
                      brace_level = line.count("{") - line.count("}")
                      block_lines = []

                  i += 1
                  continue

              # We are inside buildSettings.
              block_lines.append(line)

              brace_level += line.count("{") - line.count("}")

              if brace_level == 0:
                  processed = process_build_settings(block_lines)

                  # Remove the original block lines that were added
                  # above, then replace them with processed version.
                  new_lines = new_lines[:-len(block_lines)]

                  new_lines.extend(processed)

                  inside_build_settings = False
                  block_lines = []

              i += 1

          with open(path, "w", encoding="utf-8") as f:
              f.write("\n".join(new_lines) + "\n")

          print("Xcode signing settings configured successfully.")
          PY

          echo "Checking signing configuration..."

          grep -n "CODE_SIGN_STYLE" "$PROJECT_FILE" || true
          grep -n "CODE_SIGN_IDENTITY" "$PROJECT_FILE" || true
          grep -n "DEVELOPMENT_TEAM" "$PROJECT_FILE" || true
          grep -n "PROVISIONING_PROFILE_SPECIFIER" "$PROJECT_FILE" || true
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true


      # =========================================================
      # 9. Create ExportOptions.plist
      # =========================================================
      - name: Create ExportOptions.plist
        env:
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
          TEAM_ID: ${{ env.TEAM_ID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

            <key>method</key>
            <string>app-store</string>

            <key>destination</key>
            <string>export</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>teamID</key>
            <string>${TEAM_ID}</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>

            <key>compileBitcode</key>
            <false/>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>uploadSymbols</key>
            <true/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist:"
          cat ios/ExportOptions.plist


      # =========================================================
      # 10. Clean Flutter
      # =========================================================
      - name: Flutter clean
        run: |
          flutter clean


      # =========================================================
      # 11. Get Flutter dependencies
      # =========================================================
      - name: Flutter Pub Get
        run: |
          flutter pub get


      # =========================================================
      # 12. Install Pods again after flutter pub get
      #
      # flutter pub get may regenerate iOS plugin files.
      # =========================================================
      - name: Install Pods
        working-directory: ios
        run: |
          pod install --repo-update


      # =========================================================
      # 13. Verify CocoaPods / SwiftPM state
      # =========================================================
      - name: Verify iOS dependencies
        run: |
          echo "Checking for Swift Package Manager integration..."

          if grep -R "FlutterGeneratedPluginSwiftPackage" \
            ios/Runner.xcodeproj \
            ios/Runner.xcworkspace \
            2>/dev/null; then

            echo "WARNING: Swift Package Manager references detected."
            echo "Flutter configuration has SwiftPM disabled."
          else
            echo "No Flutter SwiftPM integration detected."
          fi

          echo ""
          echo "Checking Pods..."

          if [ -d "ios/Pods" ]; then
            echo "Pods directory exists."
          else
            echo "ERROR: Pods directory does not exist."
            exit 1
          fi


      # =========================================================
      # 14. Verify signing certificate
      # =========================================================
      - name: Verify Apple Distribution Certificate
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "Available codesigning identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""

          if security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then

            echo "Apple Distribution certificate found."

          else

            echo "ERROR: Apple Distribution certificate not found."
            exit 1

          fi


      # =========================================================
      # 15. Build signed IPA
      # =========================================================
      - name: Build iOS IPA
        run: |
          set -e

          echo "Building signed App Store IPA..."

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

          echo ""
          echo "IPA files:"
          ls -lah build/ios/ipa/


      # =========================================================
      # 16. Verify IPA exists
      # =========================================================
      - name: Verify IPA
        run: |
          set -e

          IPA_COUNT=$(find build/ios/ipa -name "*.ipa" | wc -l | tr -d ' ')

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA file was generated."
            exit 1
          fi

          echo "IPA generated successfully:"
          find build/ios/ipa -name "*.ipa" -print


      # =========================================================
      # 17. Upload IPA artifact
      # =========================================================
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 18. Upload dSYM
      # =========================================================
      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-dsym
          path: |
            build/ios/archive/Runner.xcarchive/dSYMs/**
          if-no-files-found: warn
          retention-days: 30


      # =========================================================
      # 19. Cleanup signing files
      # =========================================================
      - name: Cleanup signing data
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "Cleaning temporary signing files..."

          rm -f "$RUNNER_TEMP/ios_distribution.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"

          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          echo "Cleanup completed."
