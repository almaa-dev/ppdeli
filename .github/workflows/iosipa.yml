name: Build iOS IPA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build iOS Release IPA
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      # ─────────────── 1️⃣ تجهيز الكود ───────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # ─────────────── 2️⃣ تنظيف وتحميل الاعتماديات ───────────────
      - name: Flutter Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      # ─────────────── 3️⃣ فحوصات لا توقف البناء (تجاوز المشاكل البسيطة) ───────────────
      - name: Analyze (لا يوقف البناء عند التحذيرات)
        run: flutter analyze
        continue-on-error: true

      - name: Run Tests (لا يوقف البناء عند فشل اختبار بسيط)
        run: flutter test
        continue-on-error: true

      # ─────────────── 4️⃣ Firebase (اختياري — يتخطى إن لم يوجد) ───────────────
      - name: Restore GoogleService-Info.plist
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist restored"
          else
            echo "⚠️ No GOOGLE_SERVICE_INFO_PLIST secret — skipping"
          fi

      # ─────────────── 5️⃣ تثبيت الشهادة وملف التوفير ───────────────
      - name: Install Apple Certificate & Provisioning Profile
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ─────────────── 6️⃣ إنشاء ملف التصدير ───────────────
      - name: Create ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>__TEAM_ID__</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>__BUNDLE_ID__</key>
              <string>__PROFILE_NAME__</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          sed -i '' "s/__TEAM_ID__/$TEAM_ID/; s/__BUNDLE_ID__/$BUNDLE_ID/; s/__PROFILE_NAME__/$PROFILE_NAME/" ios/ExportOptions.plist

      # ─────────────── 7️⃣ بناء الـ IPA ───────────────
      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # ─────────────── 8️⃣ التحقق والرفع كـ Artifact ───────────────
      - name: Verify IPA
        if: always()
        run: ls -lh build/ios/ipa/*.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error
