name: Build iOS IPA

on:
  push:
    branches:
      - main # أو اسم الفرع الذي تستخدمه (مثل master)
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من جيت هب

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Keychain and Install Certificates
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }} # أضف كلمة سر شهادة p12 في Secrets إذا كانت محمية
        run: |
          # 1. إنشاء Keychain مؤقت
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          KEYCHAIN_PASSWORD="temp_password_123"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH

          # 2. استيراد شهادة p12 إلى الـ Keychain
          security import ios/signing/ios_distribution.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -allowAnyProvisioningApplications

          # 3. تكوين الوصول للشهادات
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 4. تثبيت ملف الـ Provisioning Profile
          PROVISIONING_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROVISIONING_DIR"
          cp ios/signing/ppdeli2.mobileprovision "$PROVISIONING_DIR/"

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clean and Build Archive
        run: |
          xcodebuild clean archive \
            -workspace ios/YourApp.xcworkspace \ # استبدل YourApp باسم مشروعه أو استخدم -project ios/YourApp.xcodeproj
            -scheme YourApp \                    # استبدل YourApp باسم الـ Scheme الخاص بك
            -configuration Release \
            -archivePath build/YourApp.xcarchive \
            CODE_SIGN_STYLE="Manual"

      - name: Export IPA
        run: |
          # إنشاء ملف إعدادات التصدير ExportOptions.plist تلقائياً
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string> <!-- اختر: app-store, ad-hoc, enterprise, أو development -->
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          # تصدير الـ IPA
          xcodebuild -exportArchive \
            -archivePath build/YourApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/output/*.ipa
