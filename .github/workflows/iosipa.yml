name: Build & Release (Android + iOS)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ============================================================
# 📱 ANDROID — يبني APK على ubuntu ويرفعه كـ Artifact
# ============================================================
jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Flutter Project
        run: flutter analyze
        continue-on-error: true

      - name: Run Tests
        run: flutter test

      # ✅ توقيع Android: keystore من secrets أو debug keystore احتياطي
      - name: Setup Android Signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
            echo "✅ Using release keystore from secrets"
          else
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            printf 'storeFile=debug.keystore\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' \
              > android/key.properties
            echo "⚠️ No secrets — signed with temporary debug keystore"
          fi

      - name: Restore google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: List APK
        if: always()
        run: find build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-store-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error

# ============================================================
# 🍎 iOS — يبني IPA على macOS ويرفعه لـ App Store Connect
# ============================================================
  ios:
    name: Build iOS & Upload to App Store
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Flutter Project
        run: flutter analyze
        continue-on-error: true

      - name: Run Tests
        run: flutter test

      - name: Restore GoogleService-Info.plist
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > ios/Runner/GoogleService-Info.plist
          fi

      # ✅ تثبيت الشهادة وملف التوفير في Keychain
      - name: Install Apple Certificate & Provisioning Profile
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ✅ إنشاء ملف التصدير تلقائياً من الـ Secrets
      - name: Create ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>__TEAM_ID__</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>__BUNDLE_ID__</key>
              <string>__PROFILE_NAME__</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          sed -i '' "s/__TEAM_ID__/$TEAM_ID/; s/__BUNDLE_ID__/$BUNDLE_ID/; s/__PROFILE_NAME__/$PROFILE_NAME/" ios/ExportOptions.plist

      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: List IPA
        if: always()
        run: ls -lh build/ios/ipa/*.ipa

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-store-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error

      # ✅ الرفع إلى App Store Connect
      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p $RUNNER_TEMP/asc
          echo "$API_KEY_B64" | base64 --decode > $RUNNER_TEMP/asc/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose
