name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Signed iOS IPA
    runs-on: macos-14

    env:
      APPLE_TEAM_ID: G54KQ62958
      BUNDLE_ID: com.ppdeli.market
      PROFILE_NAME: ppdeli2

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Flutter
      # ---------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # 3. Flutter doctor
      # ---------------------------------------------------------
      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      # ---------------------------------------------------------
      # 4. Install CocoaPods
      # ---------------------------------------------------------
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      # ---------------------------------------------------------
      # 5. Flutter dependencies
      # ---------------------------------------------------------
      - name: Flutter pub get
        run: |
          flutter pub get

      # ---------------------------------------------------------
      # 6. Check iOS project
      # ---------------------------------------------------------
      - name: Check iOS project
        run: |
          test -d ios
          test -f ios/Runner.xcodeproj/project.pbxproj
          echo "iOS project found."

      # ---------------------------------------------------------
      # 7. Install Pods
      # ---------------------------------------------------------
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod deintegrate || true
          pod install --repo-update

      # ---------------------------------------------------------
      # 8. Create temporary keychain
      # ---------------------------------------------------------
      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Temporary keychain created."

      # ---------------------------------------------------------
      # 9. Decode Apple Distribution P12
      # ---------------------------------------------------------
      - name: Decode Apple Distribution certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          set -e

          echo "Decoding Apple Distribution certificate..."

          printf '%s' "$IOS_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/ios_distribution.p12"

          test -s "$RUNNER_TEMP/ios_distribution.p12"

          echo "P12 file created."
          ls -lh "$RUNNER_TEMP/ios_distribution.p12"

      # ---------------------------------------------------------
      # 10. Import Apple Distribution P12
      # ---------------------------------------------------------
      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "Importing Apple Distribution certificate..."

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/ios_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo "Certificate imported successfully."

          echo "Available signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # ---------------------------------------------------------
      # 11. Install provisioning profile
      # ---------------------------------------------------------
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          echo "Installing provisioning profile..."

          PROFILE_PATH="$RUNNER_TEMP/ppdeli2.mobileprovision"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          test -s "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          # Extract UUID from profile
          PROFILE_UUID=$(
            security cms -D -i "$PROFILE_PATH" \
            | /usr/libexec/PlistBuddy \
              -c "Print :UUID"
          )

          PROFILE_DISPLAY_NAME=$(
            security cms -D -i "$PROFILE_PATH" \
            | /usr/libexec/PlistBuddy \
              -c "Print :Name"
          )

          PROFILE_APP_ID=$(
            security cms -D -i "$PROFILE_PATH" \
            | /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier"
          )

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_DISPLAY_NAME"
          echo "Profile App ID: $PROFILE_APP_ID"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Provisioning profile installed."

      # ---------------------------------------------------------
      # 12. Verify provisioning profile
      # ---------------------------------------------------------
      - name: Verify provisioning profile
        run: |
          set -e

          echo "Checking provisioning profiles..."

          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo ""
          echo "Provisioning profile information:"
          security cms -D \
            -i "$RUNNER_TEMP/ppdeli2.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

      # ---------------------------------------------------------
      # 13. Configure Xcode signing
      # ---------------------------------------------------------
      - name: Configure Xcode signing
        run: |
          set -e

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          echo "Configuring manual signing..."

          # Team ID
          sed -i '' \
            "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" \
            "$PROJECT_FILE"

          # Bundle identifier
          sed -i '' \
            "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" \
            "$PROJECT_FILE"

          # Disable automatic signing
          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT_FILE"

          # Apple Distribution identity
          sed -i '' \
            's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          echo "Xcode signing configuration:"
          grep -E \
            "DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE" \
            "$PROJECT_FILE" \
            || true

      # ---------------------------------------------------------
      # 14. Configure provisioning profile for Runner
      # ---------------------------------------------------------
      - name: Configure provisioning profile
        run: |
          set -e

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          PROFILE_UUID=$(
            security cms -D -i "$RUNNER_TEMP/ppdeli2.mobileprovision" \
            | /usr/libexec/PlistBuddy \
              -c "Print :UUID"
          )

          echo "Using provisioning profile UUID:"
          echo "$PROFILE_UUID"

          # Remove old explicit provisioning profile settings
          sed -i '' \
            '/PROVISIONING_PROFILE_SPECIFIER = /d' \
            "$PROJECT_FILE"

          sed -i '' \
            '/PROVISIONING_PROFILE = /d' \
            "$PROJECT_FILE"

          # Add profile to Runner target build configurations
          python3 - <<PY
          from pathlib import Path

          path = Path("$PROJECT_FILE")
          text = path.read_text()

          profile_uuid = "$PROFILE_UUID"

          text = text.replace(
              'CODE_SIGN_STYLE = Manual;',
              'CODE_SIGN_STYLE = Manual;'
          )

          # Add provisioning profile specifier near CODE_SIGN_IDENTITY
          text = text.replace(
              'CODE_SIGN_IDENTITY = "Apple Distribution";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";\\n\\t\\t\\t\\tPROVISIONING_PROFILE_SPECIFIER = "$PROFILE_NAME";'
          )

          path.write_text(text)
          PY

          echo "Provisioning profile configured."

      # ---------------------------------------------------------
      # 15. Clean Flutter build
      # ---------------------------------------------------------
      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get

      # ---------------------------------------------------------
      # 16. Reinstall Pods after flutter clean
      # ---------------------------------------------------------
      - name: Reinstall Pods
        working-directory: ios
        run: |
          pod install

      # ---------------------------------------------------------
      # 17. Generate Flutter iOS configuration
      # ---------------------------------------------------------
      - name: Generate Flutter iOS configuration
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # ---------------------------------------------------------
      # 18. Build signed IPA
      # ---------------------------------------------------------
      - name: Build signed IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Final signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Building signed IPA..."

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      # ---------------------------------------------------------
      # 19. Show generated IPA
      # ---------------------------------------------------------
      - name: Show IPA
        run: |
          set -e

          echo "Generated IPA files:"

          find build/ios/ipa \
            -type f \
            -name "*.ipa" \
            -print

          ls -lh build/ios/ipa/

      # ---------------------------------------------------------
      # 20. Upload IPA artifact
      # ---------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      # ---------------------------------------------------------
      # 21. Upload dSYM
      # ---------------------------------------------------------
      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-dsym
          path: build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: warn

      # ---------------------------------------------------------
      # 22. Cleanup keychain
      # ---------------------------------------------------------
      - name: Cleanup signing keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

          rm -f \
            "$RUNNER_TEMP/ios_distribution.p12" \
            "$RUNNER_TEMP/ppdeli2.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" \
            || true

          echo "Signing files cleaned up."
