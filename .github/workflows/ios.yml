name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Signed iOS IPA
    runs-on: macos-14

    env:
      APPLE_TEAM_ID: G54KQ62958
      BUNDLE_ID: com.ppdeli.market
      PROFILE_NAME: ppdeli2

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      # =========================================================
      # 3. Check Flutter
      # =========================================================
      - name: Check Flutter
        run: |
          set -e

          flutter --version
          dart --version
          xcodebuild -version
          pod --version || true

      # =========================================================
      # 4. Check signing files
      # =========================================================
      - name: Check Apple signing files
        run: |
          set -e

          echo "Checking Apple signing files..."

          if [ ! -f "ios/signing/ios_distribution.p12" ]; then
            echo "ERROR: ios/signing/ios_distribution.p12 not found."
            exit 1
          fi

          if [ ! -f "ios/signing/ppdeli2.mobileprovision" ]; then
            echo "ERROR: ios/signing/ppdeli2.mobileprovision not found."
            exit 1
          fi

          echo ""
          echo "P12:"
          ls -lh ios/signing/ios_distribution.p12

          echo ""
          echo "Provisioning Profile:"
          ls -lh ios/signing/ppdeli2.mobileprovision

          echo ""
          echo "Signing files found successfully."

      # =========================================================
      # 5. Flutter pub get
      # =========================================================
      - name: Flutter pub get
        run: |
          set -e

          flutter pub get

      # =========================================================
      # 6. Install CocoaPods
      # =========================================================
      - name: Install CocoaPods
        run: |
          set -e

          sudo gem install cocoapods

          pod --version

      # =========================================================
      # 7. Flutter clean
      # =========================================================
      - name: Flutter clean
        run: |
          set -e

          echo "Cleaning Flutter project..."

          flutter clean

          rm -rf build
          rm -rf ios/Pods
          rm -rf ios/.symlinks

          flutter pub get

          echo "Flutter clean completed."

      # =========================================================
      # 8. Create SourcePackages directory
      # =========================================================
      - name: Prepare iOS build directories
        run: |
          set -e

          echo "Creating iOS build directories..."

          mkdir -p build
          mkdir -p build/ios
          mkdir -p build/ios/SourcePackages

          echo ""
          echo "Build directory:"
          ls -la build

          echo ""
          echo "iOS build directory:"
          ls -la build/ios

          echo ""
          echo "SourcePackages directory:"
          ls -ld build/ios/SourcePackages

      # =========================================================
      # 9. Install CocoaPods dependencies
      # =========================================================
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -e

          echo "Installing CocoaPods dependencies..."

          pod deintegrate || true

          pod install --repo-update

          echo "CocoaPods installation completed."

      # =========================================================
      # 10. Prepare SourcePackages again
      # =========================================================
      - name: Prepare SourcePackages
        run: |
          set -e

          echo "Preparing SourcePackages..."

          mkdir -p build/ios/SourcePackages

          test -d build/ios/SourcePackages

          echo "SourcePackages is ready."

      # =========================================================
      # 11. Create temporary keychain
      # =========================================================
      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Creating temporary keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Temporary keychain created successfully."

      # =========================================================
      # 12. Import Apple Distribution certificate
      # =========================================================
      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "Unlocking keychain..."

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Importing Apple Distribution certificate..."

          security import \
            "ios/signing/ios_distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo ""
          echo "Certificate imported successfully."

          echo ""
          echo "Available signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # =========================================================
      # 13. Configure keychain access
      # =========================================================
      - name: Configure keychain access
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Keychain access configured."

      # =========================================================
      # 14. Read provisioning profile
      # =========================================================
      - name: Read provisioning profile
        run: |
          set -e

          PROFILE_PATH="ios/signing/ppdeli2.mobileprovision"

          echo "Reading provisioning profile..."

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME_FROM_FILE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "Provisioning Profile Information"
          echo "=========================================="
          echo "Name:       $PROFILE_NAME_FROM_FILE"
          echo "UUID:       $PROFILE_UUID"
          echo "Team ID:    $PROFILE_TEAM_ID"
          echo "App ID:     $PROFILE_APP_ID"
          echo "=========================================="

          echo ""

          # -------------------------------------------------------
          # Verify Team ID
          # -------------------------------------------------------
          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "ERROR: Team ID mismatch."
            echo "Expected: $APPLE_TEAM_ID"
            echo "Found:    $PROFILE_TEAM_ID"
            exit 1
          fi

          # -------------------------------------------------------
          # Verify Bundle ID
          # -------------------------------------------------------
          EXPECTED_APP_ID="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERROR: Bundle ID mismatch."
            echo "Expected: $EXPECTED_APP_ID"
            echo "Found:    $PROFILE_APP_ID"
            exit 1
          fi

          echo "Team ID and Bundle ID are correct."

      # =========================================================
      # 15. Install provisioning profile
      # =========================================================
      - name: Install provisioning profile
        run: |
          set -e

          PROFILE_DEST="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DEST"

          cp \
            "ios/signing/ppdeli2.mobileprovision" \
            "$PROFILE_DEST/$PROFILE_UUID.mobileprovision"

          echo "Provisioning profile installed."

          echo ""
          ls -lh "$PROFILE_DEST"

      # =========================================================
      # 16. Configure Xcode project
      # =========================================================
      - name: Configure Xcode signing
        run: |
          set -e

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          echo "Configuring Xcode project..."

          # -------------------------------------------------------
          # Team ID
          # -------------------------------------------------------
          sed -i '' \
            "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" \
            "$PROJECT_FILE"

          # -------------------------------------------------------
          # Bundle identifier
          # -------------------------------------------------------
          sed -i '' \
            "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" \
            "$PROJECT_FILE"

          # -------------------------------------------------------
          # Automatic signing -> Manual
          # -------------------------------------------------------
          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT_FILE"

          # -------------------------------------------------------
          # Apple Distribution
          # -------------------------------------------------------
          sed -i '' \
            's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PROJECT_FILE"

          echo "Basic signing configuration completed."

      # =========================================================
      # 17. Configure provisioning profile
      # =========================================================
      - name: Configure provisioning profile
        run: |
          set -e

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          echo "Configuring manual provisioning profile..."

          # Remove old provisioning profile settings
          sed -i '' \
            '/PROVISIONING_PROFILE_SPECIFIER = /d' \
            "$PROJECT_FILE" || true

          sed -i '' \
            '/PROVISIONING_PROFILE = /d' \
            "$PROJECT_FILE" || true

          python3 <<PY
from pathlib import Path

path = Path("$PROJECT_FILE")
text = path.read_text()

old = 'CODE_SIGN_IDENTITY = "Apple Distribution";'

new = (
    'CODE_SIGN_IDENTITY = "Apple Distribution";\n'
    '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$PROFILE_NAME";'
)

if old in text:
    text = text.replace(old, new)
else:
    print("WARNING: Apple Distribution identity was not found.")

path.write_text(text)
PY

          echo "Provisioning profile configured."

          echo ""
          echo "Current signing settings:"

          grep -E \
            "DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            "$PROJECT_FILE" \
            || true

      # =========================================================
      # 18. Check Generated.xcconfig
      # =========================================================
      - name: Prepare Flutter configuration
        run: |
          set -e

          echo "Preparing Flutter configuration..."

          flutter pub get

          mkdir -p build/ios/SourcePackages

          echo ""
          echo "Checking Flutter Generated.xcconfig..."

          if [ -f "ios/Flutter/Generated.xcconfig" ]; then
            echo "Generated.xcconfig exists."
          else
            echo "Generated.xcconfig does not exist yet."
            echo "Flutter will generate it during the build."
          fi

          echo ""
          echo "SourcePackages:"
          mkdir -p build/ios/SourcePackages
          ls -ld build/ios/SourcePackages

      # =========================================================
      # 19. Create ExportOptions.plist
      # =========================================================
      - name: Create ExportOptions.plist
        run: |
          set -e

          if [ -f "ios/ExportOptions.plist" ]; then
            echo "Using existing ios/ExportOptions.plist"
            echo ""
            cat ios/ExportOptions.plist
          else
            echo "Creating ios/ExportOptions.plist..."

            cat > ios/ExportOptions.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
"http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>

    <key>method</key>
    <string>app-store</string>

    <key>teamID</key>
    <string>${APPLE_TEAM_ID}</string>

    <key>signingStyle</key>
    <string>manual</string>

    <key>provisioningProfiles</key>
    <dict>
        <key>${BUNDLE_ID}</key>
        <string>${PROFILE_NAME}</string>
    </dict>

    <key>stripSwiftSymbols</key>
    <true/>

    <key>uploadSymbols</key>
    <true/>

</dict>
</plist>
EOF

            echo "ExportOptions.plist created."

            echo ""
            cat ios/ExportOptions.plist
          fi

      # =========================================================
      # 20. Final SourcePackages preparation
      # =========================================================
      - name: Prepare SourcePackages before build
        run: |
          set -e

          echo "Preparing SourcePackages before Flutter build..."

          mkdir -p build
          mkdir -p build/ios
          mkdir -p build/ios/SourcePackages

          test -d build/ios/SourcePackages

          echo "SourcePackages is ready."

      # =========================================================
      # 21. Verify signing before build
      # =========================================================
      - name: Verify signing before build
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "Unlocking keychain..."

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "=========================================="
          echo "Signing identities"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "=========================================="
          echo "Provisioning profiles"
          echo "=========================================="

          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo ""
          echo "Signing verification completed."

      # =========================================================
      # 22. Build signed IPA
      # =========================================================
      - name: Build signed IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "Unlocking signing keychain..."

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "Preparing SourcePackages one final time..."

          mkdir -p build
          mkdir -p build/ios
          mkdir -p build/ios/SourcePackages

          echo ""
          echo "Starting Flutter IPA build..."

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

          echo ""
          echo "Flutter IPA build completed."

      # =========================================================
      # 23. Verify IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -e

          echo "Checking generated IPA..."

          if [ ! -d "build/ios/ipa" ]; then
            echo "ERROR: build/ios/ipa directory does not exist."
            exit 1
          fi

          IPA_COUNT=$(
            find build/ios/ipa \
              -type f \
              -name "*.ipa" \
              | wc -l \
              | tr -d ' '
          )

          echo "IPA count: $IPA_COUNT"

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA file was generated."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "IPA generated successfully"
          echo "=========================================="

          find build/ios/ipa \
            -type f \
            -name "*.ipa" \
            -exec ls -lh {} \;

      # =========================================================
      # 24. Upload IPA
      # =========================================================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      # =========================================================
      # 25. Upload dSYM
      # =========================================================
      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppdeli-ios-dsym
          path: |
            build/ios/archive/Runner.xcarchive/dSYMs/**
          if-no-files-found: warn
          retention-days: 7

      # =========================================================
      # 26. Cleanup
      # =========================================================
      - name: Cleanup signing keychain
        if: always()
        run: |
          echo "Cleaning temporary signing environment..."

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain \
              "$KEYCHAIN_PATH" \
              || true
          fi

          rm -f \
            "$RUNNER_TEMP/profile.plist" \
            || true

          echo "Cleanup completed."
