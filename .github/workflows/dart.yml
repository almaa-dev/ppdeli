name: Build Flutter APK

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.vfs.watch=false
        -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
        -Dkotlin.incremental=false
      JAVA_TOOL_OPTIONS: "-Xmx3072m -Dfile.encoding=UTF-8"
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Flutter APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: List Built APK
        if: always()
        run: |
          echo "=== Built APK files ==="
          find build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Display Gradle Error Details on Failure
        if: failure()
        run: |
          echo "=== GRADLE BUILD FAILED - RE-RUNNING WITH STACKTRACE ==="
          cd android && ./gradlew assembleRelease --stacktrace || true
